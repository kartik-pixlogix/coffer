<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Modal</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600&amp;family=Bricolage+Grotesque:opsz,wght@12..96,200..800&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap">
<style>html,body{margin:0;background:var(--surface)}.stage{position:relative;min-height:470px;border-radius:20px;overflow:hidden;background:var(--canvas)}.stage .cf-modal{top:24px;width:500px}</style>
</head>
<body>
<div class="pv-wrap">
<section class="cf pv" data-theme="light" aria-label="Light theme">
<div class="pv-head">Light</div>
<div class="stage">
<div class="cf-scrim" aria-hidden="true"></div>
<div class="cf-modal" role="dialog" aria-modal="true" aria-labelledby="md-t">
<div class="cf-modal-head"><div class="cf-modal-title"><span class="cf-disc" style="width:40px;height:40px"><svg class="ic" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7l10 10M17 9v8H9"/></svg></span><div><h2 id="md-t" class="t-heading" style="margin:0">Record contribution</h2><span class="t-caption t-muted">Saarthi Portal JV · capital account</span></div></div><button type="button" class="cf-iconbtn" aria-label="Close"><svg class="ic" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></svg></button></div>
<div class="cf-field"><label class="cf-label" for="md-a">Amount</label><span class="cf-inwrap is-error"><span class="cf-prefix" aria-hidden="true">₹</span><input id="md-a" type="text" value="0" aria-invalid="true" style="font-family:var(--font-mono)"></span><span class="cf-errtext">Enter an amount above ₹0.</span></div>
<div class="cf-modal-foot"><button type="button" class="cf-btn cf-btn--secondary cf-btn--lg">Cancel</button><button type="button" class="cf-btn cf-btn--primary cf-btn--lg cf-btn--disc is-loading" aria-busy="true">Saving…<span class="cf-disc"><span class="cf-spinner"></span></span></button></div>
</div>
</div>
</section>
</div>
<script>(function(){var w=document.querySelector('.pv-wrap'),a=w.firstElementChild,b=a.cloneNode(true);b.setAttribute('data-theme','dark');b.setAttribute('aria-label','Dark theme');var h=b.querySelector('.pv-head');if(h)h.textContent='Dark';b.querySelectorAll('[id]').forEach(function(e){e.id+='-d'});['for','aria-labelledby','aria-describedby','aria-controls'].forEach(function(k){b.querySelectorAll('['+k+']').forEach(function(e){e.setAttribute(k,e.getAttribute(k).split(' ').map(function(x){return x+'-d'}).join(' '))})});b.querySelectorAll('[name]').forEach(function(e){e.setAttribute('name',e.getAttribute('name')+'-d')});w.appendChild(b)})();</script>
</body>
</html>
