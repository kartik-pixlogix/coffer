<!-- @dsCard group="Forms" height=470 width=1200 subtitle="Receipts and CSV imports · idle, hover, dragging, uploading, done, error" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>File drop zone</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600&amp;family=Bricolage+Grotesque:opsz,wght@12..96,200..800&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap">
<style>html,body{margin:0;background:var(--surface)}.m{grid-template-columns:repeat(2,minmax(0,1fr));align-items:start}.cf-drop{min-height:110px}</style>
</head>
<body>
<div class="pv-wrap">
<section class="cf pv" data-theme="light" aria-label="Light theme">
<div class="pv-head">Light</div>
<div class="pv-grid m">
<label class="cf-drop"><svg class="ic" width="22" height="22" viewBox="0 0 24 24" style="color:var(--ink)" aria-hidden="true"><path d="M12 16V5M7.5 9.5L12 5l4.5 4.5M5 20h14"/></svg><span><span style="color:var(--ink);font-weight:500">Drop a CSV</span> or browse</span><span class="t-caption">Up to 5 MB</span><input type="file" aria-label="Upload timesheet CSV" accept=".csv"></label>
<label class="cf-drop is-drag"><svg class="ic" width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 16V5M7.5 9.5L12 5l4.5 4.5M5 20h14"/></svg><span style="font-weight:500">Release to upload hours-oct-2026.csv</span><input type="file" aria-label="Upload file"></label>
<div class="cf-file" aria-busy="true"><svg class="ic" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 3.5h7l4 4v13h-11zM13.5 3.5v4h4M9 12h6M9 15.5h6"/></svg><span class="cf-file-name" style="display:flex;flex-direction:column;gap:4px"><span>macbook-air-invoice.pdf · 62%</span><span class="cf-progress-mini"><span style="width:62%"></span></span></span><button type="button" class="cf-iconbtn cf-iconbtn--sm cf-iconbtn--bare" aria-label="Cancel upload"><svg class="ic" width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></svg></button></div>
<div class="cf-file"><svg class="ic" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M19.5 11.5l-7.6 7.6a4.8 4.8 0 0 1-6.8-6.8l8.2-8.2a3.2 3.2 0 0 1 4.5 4.5l-8.2 8.2a1.6 1.6 0 0 1-2.3-2.3l7.4-7.4"/></svg><span class="cf-file-name">macbook-air-invoice.pdf <span class="t-muted">· 184 KB</span></span><span class="cf-pill cf-pill--pos cf-pill--sm">Uploaded</span><button type="button" class="cf-iconbtn cf-iconbtn--sm cf-iconbtn--bare" aria-label="Remove receipt"><svg class="ic" width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></svg></button></div>
<label class="cf-drop is-error" role="alert"><svg class="ic" width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4.5l8.5 15h-17zM12 10v4M12 17h.01"/></svg><span style="font-weight:500">receipt.heic isn’t supported</span><span class="t-caption">Use PDF, JPG or PNG, up to 10 MB.</span><input type="file" aria-label="Upload receipt"></label>
<label class="cf-drop cf-drop--row"><svg class="ic" width="18" height="18" viewBox="0 0 24 24" style="color:var(--ink)" aria-hidden="true"><path d="M12 16V5M7.5 9.5L12 5l4.5 4.5M5 20h14"/></svg><span><span style="color:var(--ink);font-weight:500">Upload</span> PDF, JPG or PNG, up to 10 MB</span><input type="file" aria-label="Upload receipt"></label>
</div>
</section>
</div>
<script>(function(){var w=document.querySelector('.pv-wrap'),a=w.firstElementChild,b=a.cloneNode(true);b.setAttribute('data-theme','dark');b.setAttribute('aria-label','Dark theme');var h=b.querySelector('.pv-head');if(h)h.textContent='Dark';b.querySelectorAll('[id]').forEach(function(e){e.id+='-d'});['for','aria-labelledby','aria-describedby','aria-controls'].forEach(function(k){b.querySelectorAll('['+k+']').forEach(function(e){e.setAttribute(k,e.getAttribute(k).split(' ').map(function(x){return x+'-d'}).join(' '))})});b.querySelectorAll('[name]').forEach(function(e){e.setAttribute('name',e.getAttribute('name')+'-d')});w.appendChild(b)})();</script>
</body>
</html>
