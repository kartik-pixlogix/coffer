<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Side drawer</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600&amp;family=Bricolage+Grotesque:opsz,wght@12..96,200..800&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap">
<style>html,body{margin:0;background:var(--surface)}</style>
</head>
<body>
<div class="pv-wrap">
<section class="cf pv" data-theme="light" aria-label="Light theme">
<div class="pv-head">Light</div>
<aside class="cf-drawer" aria-label="Settlement details" style="width:100%">
<div class="cf-drawer-head">
<div class="cf-row" style="align-items:flex-start;gap:12px"><span class="cf-avatar cf-avatar--lg cf-avatar--tile" style="background:var(--on-graphite);color:var(--graphite)">VL</span><span style="flex:1;display:flex;flex-direction:column;gap:2px"><span style="font-family:var(--font-display);font-size:18px;line-height:22px;font-weight:500">Vertex Labs → Bluefin Infotech</span><span class="t-caption" style="color:var(--on-graphite-muted)">Saarthi Portal JV · 50/50 sides</span></span><button type="button" class="cf-iconbtn cf-iconbtn--glass" aria-label="Close details"><svg class="ic" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></svg></button></div>
<div class="cf-row"><span class="cf-pill cf-pill--neg cf-pill--micro">OWES</span><span class="t-money" style="font-size:22px;line-height:26px">₹3,24,600</span></div>
</div>
<div class="cf-drawer-body">
<div class="cf-inset" style="display:flex;flex-direction:column;gap:8px">
<div class="cf-kv t-body"><span class="t-muted">Entitled (50%)</span><span class="t-money">₹9,21,175</span></div>
<div class="cf-kv t-body"><span class="t-muted">Holds</span><span class="t-money">₹12,45,775</span></div>
<div class="cf-kv t-body" style="border-top:1px solid var(--line);padding-top:8px"><span>To transfer</span><span class="t-money" style="font-weight:500">₹3,24,600</span></div>
</div>
<div class="cf-actions"><button type="button" class="cf-btn cf-btn--primary cf-btn--disc" style="flex:1">Record transfer<span class="cf-disc"><svg class="ic" width="16" height="16" viewBox="0 0 24 24" style="stroke-width:1.75" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span></button><button type="button" class="cf-btn cf-btn--secondary">History</button></div>
</div>
</aside>
</section>
</div>
<script>(function(){var w=document.querySelector('.pv-wrap'),a=w.firstElementChild,b=a.cloneNode(true);b.setAttribute('data-theme','dark');b.setAttribute('aria-label','Dark theme');var h=b.querySelector('.pv-head');if(h)h.textContent='Dark';b.querySelectorAll('[id]').forEach(function(e){e.id+='-d'});['for','aria-labelledby','aria-describedby','aria-controls'].forEach(function(k){b.querySelectorAll('['+k+']').forEach(function(e){e.setAttribute(k,e.getAttribute(k).split(' ').map(function(x){return x+'-d'}).join(' '))})});b.querySelectorAll('[name]').forEach(function(e){e.setAttribute('name',e.getAttribute('name')+'-d')});w.appendChild(b)})();</script>
</body>
</html>
