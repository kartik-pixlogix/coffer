<!-- @dsCard group="Charts" height=430 width=1200 subtitle="Share of a total · partner colours, or the brand ramp for categories" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Donut chart</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600&amp;family=Bricolage+Grotesque:opsz,wght@12..96,200..800&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap">
<style>html,body{margin:0;background:var(--surface)}.lg{list-style:none;margin:0;padding:0;flex:1;min-width:0;display:flex;flex-direction:column;gap:9px;font-size:13px}.lg li{display:flex;align-items:center;gap:8px}.lg li span:nth-child(2){flex:1}</style>
</head>
<body>
<div class="pv-wrap">
<section class="cf pv" data-theme="light" aria-label="Light theme">
<div class="pv-head">Light</div>
<div class="cf-card" style="display:flex;gap:16px;align-items:center;position:relative">
<div class="cf-donut" role="img" aria-label="Revenue by partner: Aarav Mehta 34%, Ishita Rao 20%, Kabir Shah 28%, Meera Iyer 17%" style="background:conic-gradient(var(--partner-1) 0deg 122.6deg,var(--surface-card) 122.6deg 123.8deg,var(--partner-2) 123.8deg 196.3deg,var(--surface-card) 196.3deg 197.5deg,var(--partner-3) 197.5deg 298.6deg,var(--surface-card) 298.6deg 299.8deg,var(--partner-4) 299.8deg 358.8deg,var(--surface-card) 358.8deg 360deg)"><div class="cf-donut-hole"><span class="t-figure-centre">₹62.1L</span><span class="t-caption t-muted">FY to date</span></div></div>
<ul class="lg"><li><span class="cf-swatch" style="background:var(--partner-1)"></span><span>Aarav Mehta</span><span class="t-money-sm t-muted">34%</span></li><li><span class="cf-swatch" style="background:var(--partner-2)"></span><span>Ishita Rao</span><span class="t-money-sm t-muted">20%</span></li><li><span class="cf-swatch" style="background:var(--partner-3)"></span><span>Kabir Shah</span><span class="t-money-sm t-muted">28%</span></li><li><span class="cf-swatch" style="background:var(--partner-4)"></span><span>Meera Iyer</span><span class="t-money-sm t-muted">17%</span></li></ul>
<span class="cf-tip" style="left:96px;top:6px"><span class="cf-tip-muted">Kabir Shah · hover</span><br><span class="t-money-sm">₹17,63,640 · 28.4%</span></span>
</div>
<div class="cf-card" style="display:flex;gap:16px;align-items:center">
<div class="cf-donut" role="img" aria-label="Expenses by category: Salary 65%, Software 9%, Hardware 9%, Marketing 7%, Travel and office 9%" style="background:conic-gradient(var(--chart-ink) 0deg 232.9deg,var(--surface-card) 232.9deg 234.1deg,var(--lime) 234.1deg 267.1deg,var(--surface-card) 267.1deg 268.3deg,var(--ink-secondary) 268.3deg 298.8deg,var(--surface-card) 298.8deg 300deg,var(--ink-faint) 300deg 325.2deg,var(--surface-card) 325.2deg 326.4deg,var(--line-strong) 326.4deg 358.8deg,var(--surface-card) 358.8deg 360deg)"><div class="cf-donut-hole"><span class="t-figure-centre">₹43.7L</span><span class="t-caption t-muted">FY to date</span></div></div>
<ul class="lg"><li><span class="cf-swatch" style="background:var(--chart-ink)"></span><span>Salary</span><span class="t-money-sm t-muted">65%</span></li><li><span class="cf-swatch" style="background:var(--lime);box-shadow:inset 0 0 0 1px var(--line-strong)"></span><span>Software</span><span class="t-money-sm t-muted">9%</span></li><li><span class="cf-swatch" style="background:var(--ink-secondary)"></span><span>Hardware</span><span class="t-money-sm t-muted">9%</span></li><li><span class="cf-swatch" style="background:var(--ink-faint)"></span><span>Marketing</span><span class="t-money-sm t-muted">7%</span></li><li><span class="cf-swatch" style="background:var(--line-strong)"></span><span>Travel &amp; office</span><span class="t-money-sm t-muted">9%</span></li></ul>
</div>
</section>
</div>
<script>(function(){var w=document.querySelector('.pv-wrap'),a=w.firstElementChild,b=a.cloneNode(true);b.setAttribute('data-theme','dark');b.setAttribute('aria-label','Dark theme');var h=b.querySelector('.pv-head');if(h)h.textContent='Dark';b.querySelectorAll('[id]').forEach(function(e){e.id+='-d'});['for','aria-labelledby','aria-describedby','aria-controls'].forEach(function(k){b.querySelectorAll('['+k+']').forEach(function(e){e.setAttribute(k,e.getAttribute(k).split(' ').map(function(x){return x+'-d'}).join(' '))})});b.querySelectorAll('[name]').forEach(function(e){e.setAttribute('name',e.getAttribute('name')+'-d')});w.appendChild(b)})();</script>
</body>
</html>
