<!-- @dsCard group="Overlays" height=520 width=1200 subtitle="Simple confirm, and type-to-confirm for irreversible actions" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Confirmation dialog</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600&amp;family=Bricolage+Grotesque:opsz,wght@12..96,200..800&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap">
<style>html,body{margin:0;background:var(--surface)}</style>
</head>
<body>
<div class="pv-wrap">
<section class="cf pv" data-theme="light" aria-label="Light theme">
<div class="pv-head">Light</div>
<div class="cf-modal cf-modal--static cf-modal--sm" role="alertdialog" aria-modal="true" aria-labelledby="cd1" aria-describedby="cd1d" style="width:100%">
<div class="cf-row" style="gap:12px"><span class="cf-alert-ic" style="width:40px;height:40px;background:var(--negative-soft);color:var(--on-negative-soft)"><svg class="ic" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 7h15M9.5 7V4.5h5V7M6.5 7l1 13h9l1-13M10 11v5M14 11v5"/></svg></span><h2 id="cd1" class="t-heading" style="margin:0;font-size:20px;line-height:24px">Delete this expense?</h2></div>
<p id="cd1d" class="t-body t-muted" style="margin:0">“Team dinner — Diwali” (₹18,500) will be removed for every partner. This can’t be undone.</p>
<div class="cf-actions" style="justify-content:flex-end"><button type="button" class="cf-btn cf-btn--secondary">Keep it</button><button type="button" class="cf-btn cf-btn--danger">Delete expense</button></div>
</div>
<div class="cf-modal cf-modal--static cf-modal--sm" role="alertdialog" aria-modal="true" aria-labelledby="cd2" style="width:100%">
<h2 id="cd2" class="t-heading" style="margin:0;font-size:20px;line-height:24px">Close FY 2025-26?</h2>
<p class="t-body t-muted" style="margin:0">Entries dated 1 Apr 2025 – 31 Mar 2026 lock, profit moves to capital accounts and opening balances roll forward.</p>
<div class="cf-field"><label class="cf-label" for="cd2i">Type <span class="cf-confirm-code">CLOSE FY 2025-26</span> to confirm</label><input id="cd2i" class="cf-input cf-input--sm is-focus" type="text" value="CLOSE FY 2025-2" autocomplete="off" style="font-family:var(--font-mono)"></div>
<div class="cf-actions" style="justify-content:flex-end"><button type="button" class="cf-btn cf-btn--secondary">Cancel</button><button type="button" class="cf-btn cf-btn--danger" disabled>Close FY</button></div>
</div>
</section>
</div>
<script>(function(){var w=document.querySelector('.pv-wrap'),a=w.firstElementChild,b=a.cloneNode(true);b.setAttribute('data-theme','dark');b.setAttribute('aria-label','Dark theme');var h=b.querySelector('.pv-head');if(h)h.textContent='Dark';b.querySelectorAll('[id]').forEach(function(e){e.id+='-d'});['for','aria-labelledby','aria-describedby','aria-controls'].forEach(function(k){b.querySelectorAll('['+k+']').forEach(function(e){e.setAttribute(k,e.getAttribute(k).split(' ').map(function(x){return x+'-d'}).join(' '))})});b.querySelectorAll('[name]').forEach(function(e){e.setAttribute('name',e.getAttribute('name')+'-d')});w.appendChild(b)})();</script>
</body>
</html>
