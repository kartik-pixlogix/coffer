<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>KPI tile</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600&amp;family=Bricolage+Grotesque:opsz,wght@12..96,200..800&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap">
<style>html,body{margin:0;background:var(--surface)}.m{grid-template-columns:repeat(2,minmax(0,1fr));align-items:stretch}</style>
</head>
<body>
<div class="pv-wrap">
<section class="cf pv" data-theme="light" aria-label="Light theme">
<div class="pv-head">Light</div>
<div class="pv-grid m">
<div class="cf-kpi"><div class="cf-kpi-head"><h3 class="cf-kpi-title"><span class="cf-kpi-ic"><svg class="ic" width="16" height="16" viewBox="0 0 24 24" style="stroke-width:1.75" aria-hidden="true"><path d="M4 16.5l5-5 3.5 3.5L20 7.5M15 7.5h5v5"/></svg></span>Total income</h3><span class="cf-trend cf-trend--up"><svg class="ic" width="12" height="12" viewBox="0 0 24 24" style="stroke-width:2" aria-hidden="true"><path d="M7 17L17 7M9 7h8v8"/></svg>6%</span></div><div class="cf-kpi-value"><span class="t-money-unit">₹</span><span class="t-money-lg">62,10,000</span></div><span class="t-caption t-muted">Default · FY 2026-27</span></div>
<div class="cf-kpi is-hover" style="transform:translateY(-3px)"><div class="cf-kpi-head"><h3 class="cf-kpi-title"><span class="cf-kpi-ic"><svg class="ic" width="16" height="16" viewBox="0 0 24 24" style="stroke-width:1.75" aria-hidden="true"><path d="M4 12a8 8 0 1 0 16 0a8 8 0 1 0 -16 0M12 4v8h8"/></svg></span>Net profit</h3><span class="cf-trend cf-trend--down"><svg class="ic" width="12" height="12" viewBox="0 0 24 24" style="stroke-width:2" aria-hidden="true"><path d="M7 7l10 10M17 9v8H9"/></svg>8%</span></div><div class="cf-kpi-value"><span class="t-money-unit">₹</span><span class="t-money-lg">18,42,350</span></div><span class="t-caption t-muted">Hover · lifts 3 px</span></div>
<div class="cf-kpi is-selected"><div class="cf-kpi-head"><h3 class="cf-kpi-title"><span class="cf-kpi-ic"><svg class="ic" width="16" height="16" viewBox="0 0 24 24" style="stroke-width:1.75" aria-hidden="true"><path d="M4 12a8 8 0 1 0 16 0a8 8 0 1 0 -16 0M12 8v4.2l2.8 1.8"/></svg></span>Total hours</h3></div><div class="cf-kpi-value"><span class="t-money-lg">2,157.5</span><span class="t-money-unit">h</span></div><span class="t-caption t-muted">Selected · filters the table</span></div>
<div class="cf-kpi is-loading" aria-busy="true"><div class="cf-kpi-head"><span class="cf-skel" style="width:140px;height:32px;border-radius:9999px"></span></div><span class="cf-skel" style="width:70%;height:36px"></span><span class="cf-skel cf-skel--line" style="width:50%"></span></div>
<div class="cf-kpi"><div class="cf-kpi-head"><h3 class="cf-kpi-title"><span class="cf-kpi-ic"><svg class="ic" width="16" height="16" viewBox="0 0 24 24" style="stroke-width:1.75" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span>Pending approval</h3><span class="cf-pill cf-pill--warn">1 expense</span></div><div class="cf-kpi-value"><span class="t-money-unit">₹</span><span class="t-money-lg">25,000</span></div><a href="#" class="t-caption" style="font-weight:500">Review in Expenses</a></div>
<div class="cf-kpi"><div class="cf-kpi-head"><h3 class="cf-kpi-title"><span class="cf-kpi-ic"><svg class="ic" width="16" height="16" viewBox="0 0 24 24" style="stroke-width:1.75" aria-hidden="true"><path d="M6.5 3.5h11v17l-2.75-1.6-2.75 1.6-2.75-1.6-2.75 1.6zM9.5 8h5M9.5 11.5h5M9.5 15h3"/></svg></span>Total expenses</h3></div><div class="cf-errtext" role="alert" style="font-size:13px"><svg class="ic" width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4.5l8.5 15h-17zM12 10v4M12 17h.01"/></svg>Couldn’t load totals.</div><button type="button" class="cf-btn cf-btn--secondary cf-btn--sm" style="align-self:flex-start">Try again</button></div>
</div>
</section>
</div>
<script>(function(){var w=document.querySelector('.pv-wrap'),a=w.firstElementChild,b=a.cloneNode(true);b.setAttribute('data-theme','dark');b.setAttribute('aria-label','Dark theme');var h=b.querySelector('.pv-head');if(h)h.textContent='Dark';b.querySelectorAll('[id]').forEach(function(e){e.id+='-d'});['for','aria-labelledby','aria-describedby','aria-controls'].forEach(function(k){b.querySelectorAll('['+k+']').forEach(function(e){e.setAttribute(k,e.getAttribute(k).split(' ').map(function(x){return x+'-d'}).join(' '))})});b.querySelectorAll('[name]').forEach(function(e){e.setAttribute('name',e.getAttribute('name')+'-d')});w.appendChild(b)})();</script>
</body>
</html>
