<!-- @dsCard group="Tables" height=260 width=1200 subtitle="Status filters with counts, and removable applied filters" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Filter chips</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600&amp;family=Bricolage+Grotesque:opsz,wght@12..96,200..800&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap">
<style>html,body{margin:0;background:var(--surface)}</style>
</head>
<body>
<div class="pv-wrap">
<section class="cf pv" data-theme="light" aria-label="Light theme">
<div class="pv-head">Light</div>
<div class="pv-row" role="group" aria-label="Status">
<button type="button" class="cf-chip" aria-pressed="true">All<span class="t-money-sm">10</span></button>
<button type="button" class="cf-chip is-hover" aria-pressed="false">Pending<span class="t-money-sm">1</span></button>
<button type="button" class="cf-chip is-focus" aria-pressed="false">Approved<span class="t-money-sm">8</span></button>
<button type="button" class="cf-chip" aria-pressed="false" disabled>Rejected<span class="t-money-sm">0</span></button>
</div>
<span class="pv-state">Applied filters · removable</span>
<div class="pv-row">
<span class="cf-chip" style="color:var(--ink)">Paid by: Kabir Shah<button type="button" class="cf-chip-x" aria-label="Remove Paid by filter"><svg class="ic" width="12" height="12" viewBox="0 0 24 24" style="stroke-width:2" aria-hidden="true"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></svg></button></span>
<span class="cf-chip" style="color:var(--ink)">Category: Software<button type="button" class="cf-chip-x" aria-label="Remove Category filter"><svg class="ic" width="12" height="12" viewBox="0 0 24 24" style="stroke-width:2" aria-hidden="true"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></svg></button></span>
<button type="button" class="cf-link">Clear all</button>
</div>
</section>
</div>
<script>(function(){var w=document.querySelector('.pv-wrap'),a=w.firstElementChild,b=a.cloneNode(true);b.setAttribute('data-theme','dark');b.setAttribute('aria-label','Dark theme');var h=b.querySelector('.pv-head');if(h)h.textContent='Dark';b.querySelectorAll('[id]').forEach(function(e){e.id+='-d'});['for','aria-labelledby','aria-describedby','aria-controls'].forEach(function(k){b.querySelectorAll('['+k+']').forEach(function(e){e.setAttribute(k,e.getAttribute(k).split(' ').map(function(x){return x+'-d'}).join(' '))})});b.querySelectorAll('[name]').forEach(function(e){e.setAttribute('name',e.getAttribute('name')+'-d')});w.appendChild(b)})();</script>
</body>
</html>
