<!-- @dsCard group="Navigation" height=520 width=1200 subtitle="⌘K · jump to pages, records and actions" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Command palette</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600&amp;family=Bricolage+Grotesque:opsz,wght@12..96,200..800&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap">
<style>html,body{margin:0;background:var(--surface)}.cf-menu{padding:6px 8px 8px}</style>
</head>
<body>
<div class="pv-wrap">
<section class="cf pv" data-theme="light" aria-label="Light theme">
<div class="pv-head">Light</div>
<div class="cf-pop cf-cmdk" role="dialog" aria-label="Command palette">
<div class="cf-cmdk-input"><svg class="ic" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 11a6.5 6.5 0 1 0 13 0a6.5 6.5 0 1 0 -13 0M20 20l-4.3-4.3"/></svg><input type="text" role="combobox" aria-expanded="true" aria-label="Search or jump to" value="sett"><span class="cf-kbd">Esc</span></div>
<div class="cf-menu" role="listbox" aria-label="Results">
<div class="cf-menu-label">Pages</div>
<button type="button" class="cf-menu-item is-active" role="option" aria-selected="true"><svg class="ic" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h15M15.5 4.5L19 8l-3.5 3.5M20 16H5M8.5 12.5L5 16l3.5 3.5"/></svg><span><mark style="background:var(--lime);color:var(--on-lime);border-radius:3px">Sett</mark>lements</span><span class="cf-kbd">↵</span></button>
<button type="button" class="cf-menu-item" role="option"><svg class="ic" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h9M17 7h3M4 17h3M11 17h9M13 7a2 2 0 1 0 4 0a2 2 0 1 0 -4 0M7 17a2 2 0 1 0 4 0a2 2 0 1 0 -4 0"/></svg><span><mark style="background:var(--lime);color:var(--on-lime);border-radius:3px">Sett</mark>ings · Company</span></button>
<div class="cf-menu-label">Actions</div>
<button type="button" class="cf-menu-item" role="option"><svg class="ic" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><span>Record transfer · <span class="t-muted">Vertex Labs owes ₹3,24,600</span></span></button>
<div class="cf-menu-label">Vault</div>
<button type="button" class="cf-menu-item" role="option"><span class="cf-avatar cf-avatar--sm cf-avatar--tile cf-avatar--graphite">GW</span><span>Google Workspace — super admin <span class="t-muted">· settings</span></span></button>
</div>
<div class="cf-cmdk-foot"><span><span class="cf-kbd">↑</span> <span class="cf-kbd">↓</span> move</span><span><span class="cf-kbd">↵</span> open</span><span><span class="cf-kbd">Esc</span> close</span></div>
</div>
</section>
</div>
<script>(function(){var w=document.querySelector('.pv-wrap'),a=w.firstElementChild,b=a.cloneNode(true);b.setAttribute('data-theme','dark');b.setAttribute('aria-label','Dark theme');var h=b.querySelector('.pv-head');if(h)h.textContent='Dark';b.querySelectorAll('[id]').forEach(function(e){e.id+='-d'});['for','aria-labelledby','aria-describedby','aria-controls'].forEach(function(k){b.querySelectorAll('['+k+']').forEach(function(e){e.setAttribute(k,e.getAttribute(k).split(' ').map(function(x){return x+'-d'}).join(' '))})});b.querySelectorAll('[name]').forEach(function(e){e.setAttribute('name',e.getAttribute('name')+'-d')});w.appendChild(b)})();</script>
</body>
</html>
