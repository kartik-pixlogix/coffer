<!-- @dsCard group="Status" height=330 width=1200 subtitle="Approved, Pending, Rejected, Billable, Non-billable, OWES, OWED, Settled, Auto, Production, Staging, Dev" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Status pill</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600&amp;family=Bricolage+Grotesque:opsz,wght@12..96,200..800&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap">
<style>html,body{margin:0;background:var(--surface)}.m{grid-template-columns:repeat(3,minmax(0,1fr));justify-items:start}</style>
</head>
<body>
<div class="pv-wrap">
<section class="cf pv" data-theme="light" aria-label="Light theme">
<div class="pv-head">Light</div>
<div class="pv-grid m">
<span class="cf-pill cf-pill--pos"><svg class="ic" width="13" height="13" viewBox="0 0 24 24" style="stroke-width:2" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>Approved</span>
<span class="cf-pill cf-pill--warn"><svg class="ic" width="13" height="13" viewBox="0 0 24 24" style="stroke-width:2" aria-hidden="true"><path d="M4 12a8 8 0 1 0 16 0a8 8 0 1 0 -16 0M12 8v4.2l2.8 1.8"/></svg>Pending</span>
<span class="cf-pill cf-pill--neg"><svg class="ic" width="13" height="13" viewBox="0 0 24 24" style="stroke-width:2" aria-hidden="true"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></svg>Rejected</span>
<span class="cf-pill cf-pill--info"><svg class="ic" width="13" height="13" viewBox="0 0 24 24" style="stroke-width:2" aria-hidden="true"><path d="M5 12h14M12 5v14"/></svg>Billable</span>
<span class="cf-pill"><svg class="ic" width="13" height="13" viewBox="0 0 24 24" style="stroke-width:2" aria-hidden="true"><path d="M5 12h14"/></svg>Non-billable</span>
<span class="cf-pill cf-pill--neg cf-pill--micro"><svg class="ic" width="12" height="12" viewBox="0 0 24 24" style="stroke-width:2" aria-hidden="true"><path d="M12 4.5l8.5 15h-17zM12 10v4M12 17h.01"/></svg>OWES</span>
<span class="cf-pill cf-pill--pos cf-pill--micro"><svg class="ic" width="12" height="12" viewBox="0 0 24 24" style="stroke-width:2" aria-hidden="true"><path d="M12 19V5M5.5 11.5L12 5l6.5 6.5"/></svg>OWED</span>
<span class="cf-pill cf-pill--pos cf-pill--micro"><svg class="ic" width="12" height="12" viewBox="0 0 24 24" style="stroke-width:2" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>SETTLED</span>
<span class="cf-pill"><svg class="ic" width="12" height="12" viewBox="0 0 24 24" style="stroke-width:2" aria-hidden="true"><path d="M19.5 11a7.5 7.5 0 1 0-2.2 5.3M19.5 5v6h-6"/></svg>Auto</span>
<span class="cf-pill cf-pill--graphite">Production</span>
<span class="cf-pill cf-pill--warn">Staging</span>
<span class="cf-pill cf-pill--outline">Dev</span>
</div>
<div class="pv-row"><span class="cf-pill cf-pill--sm cf-pill--pos">Small</span><span class="cf-pill cf-pill--lime">New</span><span class="cf-pill cf-pill--neg">Breached</span><span class="cf-pill cf-pill--warn">Expires in 9 days</span><span class="cf-skel" style="width:76px;height:24px;border-radius:9999px" aria-label="Loading"></span></div>
</section>
</div>
<script>(function(){var w=document.querySelector('.pv-wrap'),a=w.firstElementChild,b=a.cloneNode(true);b.setAttribute('data-theme','dark');b.setAttribute('aria-label','Dark theme');var h=b.querySelector('.pv-head');if(h)h.textContent='Dark';b.querySelectorAll('[id]').forEach(function(e){e.id+='-d'});['for','aria-labelledby','aria-describedby','aria-controls'].forEach(function(k){b.querySelectorAll('['+k+']').forEach(function(e){e.setAttribute(k,e.getAttribute(k).split(' ').map(function(x){return x+'-d'}).join(' '))})});b.querySelectorAll('[name]').forEach(function(e){e.setAttribute('name',e.getAttribute('name')+'-d')});w.appendChild(b)})();</script>
</body>
</html>
