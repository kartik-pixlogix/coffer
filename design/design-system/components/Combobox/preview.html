<!-- @dsCard group="Forms" height=430 width=1200 subtitle="Searchable select, shown open with a match highlighted" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Combobox</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600&amp;family=Bricolage+Grotesque:opsz,wght@12..96,200..800&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap">
<style>html,body{margin:0;background:var(--surface)}.m{grid-template-columns:repeat(2,minmax(0,1fr));align-items:start}</style>
</head>
<body>
<div class="pv-wrap">
<section class="cf pv" data-theme="light" aria-label="Light theme">
<div class="pv-head">Light</div>
<div class="pv-grid m">
<div class="cf-field"><label class="cf-label" for="cb1">Open · searching</label>
<span class="cf-inwrap is-focus"><svg class="ic" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 11a6.5 6.5 0 1 0 13 0a6.5 6.5 0 1 0 -13 0M20 20l-4.3-4.3"/></svg><input id="cb1" type="text" role="combobox" aria-expanded="true" aria-controls="cb1l" aria-activedescendant="cb1o2" value="sha"></span>
<div class="cf-pop"><ul class="cf-listbox" id="cb1l" role="listbox" aria-label="Partners">
<li role="option" id="cb1o1" class="cf-option" aria-selected="false"><span class="cf-avatar cf-avatar--sm">KS<span class="cf-avatar-dot" style="background:var(--partner-3)"></span></span><span>Kabir <mark>Sha</mark>h <span class="t-muted">· Bluefin Infotech</span></span></li>
<li role="option" id="cb1o2" class="cf-option is-active" aria-selected="true"><span class="cf-avatar cf-avatar--sm">SQ<span class="cf-avatar-dot" style="background:var(--partner-3)"></span></span><span>Sana Qureshi <span class="t-muted">· <mark>sha</mark>red with Kabir</span></span><svg class="ic cf-check-ic" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></li>
<li role="option" id="cb1o3" class="cf-option" aria-disabled="true"><span class="cf-avatar cf-avatar--sm">NJ</span><span>Neha Joshi <span class="t-muted">· inactive</span></span></li>
</ul></div></div>
<div style="display:flex;flex-direction:column;gap:16px">
<div class="cf-field"><span class="cf-label">Closed · value</span><button type="button" class="cf-selectbox" aria-haspopup="listbox"><span>Kabir Shah — Bluefin Infotech</span><svg class="ic" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9.5l6 6 6-6"/></svg></button></div>
<div class="cf-field"><span class="cf-label">Loading results</span><span class="cf-inwrap"><input type="text" aria-label="Linked user account" value="sana@"><span class="cf-spinner" style="margin-right:10px;color:var(--ink-secondary)"></span></span></div>
<div class="cf-field"><span class="cf-label">No match · error</span><span class="cf-inwrap is-error"><input type="text" aria-label="Project" value="Saarthi mobile" aria-invalid="true"></span><span class="cf-errtext">No project called “Saarthi mobile”. <button type="button" class="cf-link" style="height:auto;color:inherit">Create it</button></span></div>
</div>
</div>
</section>
</div>
<script>(function(){var w=document.querySelector('.pv-wrap'),a=w.firstElementChild,b=a.cloneNode(true);b.setAttribute('data-theme','dark');b.setAttribute('aria-label','Dark theme');var h=b.querySelector('.pv-head');if(h)h.textContent='Dark';b.querySelectorAll('[id]').forEach(function(e){e.id+='-d'});['for','aria-labelledby','aria-describedby','aria-controls','aria-activedescendant'].forEach(function(k){b.querySelectorAll('['+k+']').forEach(function(e){e.setAttribute(k,e.getAttribute(k).split(' ').map(function(x){return x+'-d'}).join(' '))})});b.querySelectorAll('[name]').forEach(function(e){e.setAttribute('name',e.getAttribute('name')+'-d')});w.appendChild(b)})();</script>
</body>
</html>
