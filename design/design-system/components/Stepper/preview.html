<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Stepper</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600&amp;family=Bricolage+Grotesque:opsz,wght@12..96,200..800&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap">
<style>html,body{margin:0;background:var(--surface)}</style>
</head>
<body>
<div class="pv-wrap">
<section class="cf pv" data-theme="light" aria-label="Light theme">
<div class="pv-head">Light</div>
<ol class="cf-stepper" aria-label="Create company">
<li class="cf-step is-done"><span class="cf-step-n"><svg class="ic" width="14" height="14" viewBox="0 0 24 24" style="stroke-width:2.5" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span>Company &amp; partners</li>
<li class="cf-step-line is-done" aria-hidden="true"></li>
<li class="cf-step" aria-current="step"><span class="cf-step-n">2</span>Team</li>
<li class="cf-step-line" aria-hidden="true"></li>
<li class="cf-step"><span class="cf-step-n">3</span>Review &amp; launch</li>
</ol>
<ol class="cf-stepper" aria-label="Bulk import">
<li class="cf-step is-done"><span class="cf-step-n"><svg class="ic" width="14" height="14" viewBox="0 0 24 24" style="stroke-width:2.5" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span>Upload</li>
<li class="cf-step-line is-done" aria-hidden="true"></li>
<li class="cf-step is-done"><span class="cf-step-n"><svg class="ic" width="14" height="14" viewBox="0 0 24 24" style="stroke-width:2.5" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span>Map columns</li>
<li class="cf-step-line is-done" aria-hidden="true"></li>
<li class="cf-step" aria-current="step"><span class="cf-step-n">3</span>Preview</li>
</ol>
</section>
</div>
<script>(function(){var w=document.querySelector('.pv-wrap'),a=w.firstElementChild,b=a.cloneNode(true);b.setAttribute('data-theme','dark');b.setAttribute('aria-label','Dark theme');var h=b.querySelector('.pv-head');if(h)h.textContent='Dark';b.querySelectorAll('[id]').forEach(function(e){e.id+='-d'});['for','aria-labelledby','aria-describedby','aria-controls'].forEach(function(k){b.querySelectorAll('['+k+']').forEach(function(e){e.setAttribute(k,e.getAttribute(k).split(' ').map(function(x){return x+'-d'}).join(' '))})});b.querySelectorAll('[name]').forEach(function(e){e.setAttribute('name',e.getAttribute('name')+'-d')});w.appendChild(b)})();</script>
</body>
</html>
