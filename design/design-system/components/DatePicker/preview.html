<!-- @dsCard group="Forms" height=470 width=1200 subtitle="Field plus calendar popover · today, selected, range, unavailable" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Date picker</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600&amp;family=Bricolage+Grotesque:opsz,wght@12..96,200..800&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap">
<style>html,body{margin:0;background:var(--surface)}</style>
</head>
<body>
<div class="pv-wrap">
<section class="cf pv" data-theme="light" aria-label="Light theme">
<div class="pv-head">Light</div>
<div class="pv-row" style="align-items:flex-start">
<div style="display:flex;flex-direction:column;gap:8px;width:300px">
<div class="cf-field"><label class="cf-label" for="dp1">Date</label><span class="cf-inwrap is-focus"><input id="dp1" type="text" value="22 Oct 2026" aria-haspopup="dialog" aria-expanded="true"><button type="button" class="cf-iconbtn cf-iconbtn--bare cf-iconbtn--sm" aria-label="Choose date"><svg class="ic" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5h12a2 2 0 0 1 2 2v11a2 2 0 0 1 -2 2h-12a2 2 0 0 1 -2 -2v-11a2 2 0 0 1 2 -2zM4 10h16M8.5 3v4M15.5 3v4"/></svg></button></span></div>
<div class="cf-pop cf-cal" role="dialog" aria-label="Choose a date">
<div class="cf-cal-head"><button type="button" class="cf-iconbtn cf-iconbtn--sm" aria-label="Previous month"><svg class="ic" width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 6l-6 6 6 6"/></svg></button><span class="t-title">October 2026</span><button type="button" class="cf-iconbtn cf-iconbtn--sm" aria-label="Next month"><svg class="ic" width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><path d="M9.5 6l6 6-6 6"/></svg></button></div>
<div class="cf-cal-grid">
<span class="cf-cal-dow">Mo</span><span class="cf-cal-dow">Tu</span><span class="cf-cal-dow">We</span><span class="cf-cal-dow">Th</span><span class="cf-cal-dow">Fr</span><span class="cf-cal-dow">Sa</span><span class="cf-cal-dow">Su</span>
<button type="button" class="cf-day is-muted">28</button><button type="button" class="cf-day is-muted">29</button><button type="button" class="cf-day is-muted">30</button><button type="button" class="cf-day">1</button><button type="button" class="cf-day">2</button><button type="button" class="cf-day">3</button><button type="button" class="cf-day">4</button>
<button type="button" class="cf-day">5</button><button type="button" class="cf-day">6</button><button type="button" class="cf-day">7</button><button type="button" class="cf-day">8</button><button type="button" class="cf-day">9</button><button type="button" class="cf-day">10</button><button type="button" class="cf-day">11</button>
<button type="button" class="cf-day">12</button><button type="button" class="cf-day">13</button><button type="button" class="cf-day">14</button><button type="button" class="cf-day">15</button><button type="button" class="cf-day">16</button><button type="button" class="cf-day">17</button><button type="button" class="cf-day">18</button>
<button type="button" class="cf-day">19</button><button type="button" class="cf-day">20</button><button type="button" class="cf-day">21</button><button type="button" class="cf-day" aria-pressed="true">22</button><button type="button" class="cf-day">23</button><button type="button" class="cf-day">24</button><button type="button" class="cf-day">25</button>
<button type="button" class="cf-day">26</button><button type="button" class="cf-day">27</button><button type="button" class="cf-day">28</button><button type="button" class="cf-day">29</button><button type="button" class="cf-day">30</button><button type="button" class="cf-day">31</button><button type="button" class="cf-day is-muted">1</button>
</div></div></div>
<div style="display:flex;flex-direction:column;gap:12px;flex:1;min-width:200px">
<span class="pv-state">Range (FY report) · today ringed · locked days</span>
<div class="cf-cal-grid" style="max-width:260px">
<button type="button" class="cf-day">9</button><button type="button" class="cf-day is-selected">10</button><button type="button" class="cf-day is-range">11</button><button type="button" class="cf-day is-range">12</button><button type="button" class="cf-day is-range">13</button><button type="button" class="cf-day is-today">15</button><button type="button" class="cf-day" disabled>16</button>
</div>
<div class="cf-field"><span class="cf-label">Error</span><span class="cf-inwrap is-error"><input type="text" value="31 Mar 2026" aria-label="Date" aria-invalid="true"></span><span class="cf-errtext">FY 2025-26 is closed. Pick a date from 1 Apr 2026.</span></div>
</div>
</div>
</section>
</div>
<script>(function(){var w=document.querySelector('.pv-wrap'),a=w.firstElementChild,b=a.cloneNode(true);b.setAttribute('data-theme','dark');b.setAttribute('aria-label','Dark theme');var h=b.querySelector('.pv-head');if(h)h.textContent='Dark';b.querySelectorAll('[id]').forEach(function(e){e.id+='-d'});['for','aria-labelledby','aria-describedby','aria-controls'].forEach(function(k){b.querySelectorAll('['+k+']').forEach(function(e){e.setAttribute(k,e.getAttribute(k).split(' ').map(function(x){return x+'-d'}).join(' '))})});b.querySelectorAll('[name]').forEach(function(e){e.setAttribute('name',e.getAttribute('name')+'-d')});w.appendChild(b)})();</script>
</body>
</html>
