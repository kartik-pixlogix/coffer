<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Company switcher</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600&amp;family=Bricolage+Grotesque:opsz,wght@12..96,200..800&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap">
<style>html,body{margin:0;background:var(--surface)}</style>
</head>
<body>
<div class="pv-wrap">
<section class="cf pv" data-theme="light" aria-label="Light theme">
<div class="pv-head">Light</div>
<div style="display:flex;flex-direction:column;gap:8px;align-items:flex-start">
<button type="button" class="cf-switcher" aria-expanded="true" aria-haspopup="listbox" aria-label="Switch company"><span class="cf-switcher-ini">SP</span><span class="cf-stack"><span class="t-label-strong">Saarthi Portal JV</span><span class="t-caption t-muted">Joint Venture · Admin</span></span><svg class="ic" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9.5l6 6 6-6"/></svg></button>
<div class="cf-pop cf-menu" role="listbox" aria-label="Your companies" style="width:300px">
<div class="cf-menu-label">Vertex Group · your companies</div>
<button type="button" class="cf-menu-item" role="option" aria-selected="true" style="background:var(--surface-muted)"><span class="cf-avatar cf-avatar--sm">SP</span><span class="cf-stack" style="flex:1"><span class="t-label-strong">Saarthi Portal JV</span><span class="t-caption t-muted">Joint Venture · Admin</span></span><svg class="ic" width="16" height="16" viewBox="0 0 24 24" style="stroke-width:1.75" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></button>
<button type="button" class="cf-menu-item" role="option" aria-selected="false"><span class="cf-avatar cf-avatar--sm">VL</span><span class="cf-stack" style="flex:1"><span class="t-label-strong">Vertex Labs Pvt Ltd</span><span class="t-caption t-muted">Single · Admin</span></span></button>
<button type="button" class="cf-menu-item is-active" role="option" aria-selected="false"><span class="cf-avatar cf-avatar--sm">NS</span><span class="cf-stack" style="flex:1"><span class="t-label-strong">Northstar Studio</span><span class="t-caption t-muted">Single · Partner</span></span></button>
<button type="button" class="cf-menu-item" role="option" aria-selected="false"><span class="cf-avatar cf-avatar--sm">KC</span><span class="cf-stack" style="flex:1"><span class="t-label-strong">Kriya Commerce</span><span class="t-caption t-muted">Single · Viewer</span></span></button>
<div class="cf-menu-sep" role="separator"></div>
<button type="button" class="cf-menu-item"><span class="cf-disc" style="width:28px;height:28px"><svg class="ic" width="14" height="14" viewBox="0 0 24 24" style="stroke-width:1.75" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></span><span class="t-label-strong">New company</span></button>
</div></div>
</section>
</div>
<script>(function(){var w=document.querySelector('.pv-wrap'),a=w.firstElementChild,b=a.cloneNode(true);b.setAttribute('data-theme','dark');b.setAttribute('aria-label','Dark theme');var h=b.querySelector('.pv-head');if(h)h.textContent='Dark';b.querySelectorAll('[id]').forEach(function(e){e.id+='-d'});['for','aria-labelledby','aria-describedby','aria-controls'].forEach(function(k){b.querySelectorAll('['+k+']').forEach(function(e){e.setAttribute(k,e.getAttribute(k).split(' ').map(function(x){return x+'-d'}).join(' '))})});b.querySelectorAll('[name]').forEach(function(e){e.setAttribute('name',e.getAttribute('name')+'-d')});w.appendChild(b)})();</script>
</body>
</html>
