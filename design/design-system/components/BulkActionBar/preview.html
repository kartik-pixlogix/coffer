<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Bulk-action bar</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600&amp;family=Bricolage+Grotesque:opsz,wght@12..96,200..800&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap">
<style>html,body{margin:0;background:var(--surface)}</style>
</head>
<body>
<div class="pv-wrap">
<section class="cf pv" data-theme="light" aria-label="Light theme">
<div class="pv-head">Light</div>
<div class="cf-bulkbar" role="region" aria-label="3 expenses selected">
<span class="cf-bulkbar-count">3 selected · <span class="t-money-sm" style="color:var(--on-graphite)">₹1,04,200</span></span>
<button type="button" class="cf-btn cf-btn--lime cf-btn--sm"><svg class="ic" width="14" height="14" viewBox="0 0 24 24" style="stroke-width:2" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>Approve</button>
<button type="button" class="cf-btn cf-btn--glass cf-btn--sm">Reject</button>
<button type="button" class="cf-btn cf-btn--glass cf-btn--sm">Export</button>
<button type="button" class="cf-iconbtn cf-iconbtn--sm cf-iconbtn--glass" aria-label="Clear selection"><svg class="ic" width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></svg></button>
</div>
<div class="cf-bulkbar" role="region" aria-label="Approving" aria-busy="true">
<span class="cf-bulkbar-count">Approving 3 expenses…</span>
<button type="button" class="cf-btn cf-btn--lime cf-btn--sm is-loading" disabled><span class="cf-spinner"></span>Approve</button>
<button type="button" class="cf-btn cf-btn--glass cf-btn--sm" disabled>Reject</button>
</div>
</section>
</div>
<script>(function(){var w=document.querySelector('.pv-wrap'),a=w.firstElementChild,b=a.cloneNode(true);b.setAttribute('data-theme','dark');b.setAttribute('aria-label','Dark theme');var h=b.querySelector('.pv-head');if(h)h.textContent='Dark';b.querySelectorAll('[id]').forEach(function(e){e.id+='-d'});['for','aria-labelledby','aria-describedby','aria-controls'].forEach(function(k){b.querySelectorAll('['+k+']').forEach(function(e){e.setAttribute(k,e.getAttribute(k).split(' ').map(function(x){return x+'-d'}).join(' '))})});b.querySelectorAll('[name]').forEach(function(e){e.setAttribute('name',e.getAttribute('name')+'-d')});w.appendChild(b)})();</script>
</body>
</html>
