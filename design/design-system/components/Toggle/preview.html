<!-- @dsCard group="Forms" height=300 width=1200 subtitle="On/off switch for settings that apply at once" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Toggle</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600&amp;family=Bricolage+Grotesque:opsz,wght@12..96,200..800&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap">
<style>html,body{margin:0;background:var(--surface)}.m{grid-template-columns:repeat(2,minmax(0,1fr))}</style>
</head>
<body>
<div class="pv-wrap">
<section class="cf pv" data-theme="light" aria-label="Light theme">
<div class="pv-head">Light</div>
<div class="pv-grid m">
<label class="cf-switch"><input class="cf-sr" type="checkbox" role="switch"><span class="cf-switch-track"></span><span>Off</span></label>
<label class="cf-switch"><input class="cf-sr" type="checkbox" role="switch" checked><span class="cf-switch-track"></span><span>Include Saturdays</span></label>
<label class="cf-switch is-hover"><input class="cf-sr" type="checkbox" role="switch"><span class="cf-switch-track"></span><span>Hover</span></label>
<label class="cf-switch is-focus"><input class="cf-sr" type="checkbox" role="switch" checked><span class="cf-switch-track"></span><span>Focus</span></label>
<label class="cf-switch"><input class="cf-sr" type="checkbox" role="switch" disabled><span class="cf-switch-track"></span><span class="t-faint">Disabled off</span></label>
<label class="cf-switch"><input class="cf-sr" type="checkbox" role="switch" checked disabled><span class="cf-switch-track"></span><span class="t-faint">Disabled on</span></label>
<label class="cf-switch" aria-busy="true"><input class="cf-sr" type="checkbox" role="switch" checked><span class="cf-switch-track"></span><span class="pv-row" style="gap:6px">Saving<span class="cf-spinner" style="width:12px;height:12px"></span></span></label>
<div class="cf-field"><label class="cf-switch"><input class="cf-sr" type="checkbox" role="switch" aria-invalid="true" aria-describedby="tg-e"><span class="cf-switch-track" style="box-shadow:0 0 0 2px var(--negative)"></span><span>Require 2FA</span></label><span id="tg-e" class="cf-errtext">Set up your own 2FA first.</span></div>
</div>
</section>
</div>
<script>(function(){var w=document.querySelector('.pv-wrap'),a=w.firstElementChild,b=a.cloneNode(true);b.setAttribute('data-theme','dark');b.setAttribute('aria-label','Dark theme');var h=b.querySelector('.pv-head');if(h)h.textContent='Dark';b.querySelectorAll('[id]').forEach(function(e){e.id+='-d'});['for','aria-labelledby','aria-describedby','aria-controls'].forEach(function(k){b.querySelectorAll('['+k+']').forEach(function(e){e.setAttribute(k,e.getAttribute(k).split(' ').map(function(x){return x+'-d'}).join(' '))})});b.querySelectorAll('[name]').forEach(function(e){e.setAttribute('name',e.getAttribute('name')+'-d')});w.appendChild(b)})();</script>
</body>
</html>
