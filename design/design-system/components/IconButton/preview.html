<!-- @dsCard group="Actions" height=330 width=1200 subtitle="Round icon-only buttons · 54, 40 and 32 px" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Icon button</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600&amp;family=Bricolage+Grotesque:opsz,wght@12..96,200..800&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap">
<style>html,body{margin:0;background:var(--surface)}.m{grid-template-columns:repeat(7,minmax(0,1fr))}</style>
</head>
<body>
<div class="pv-wrap">
<section class="cf pv" data-theme="light" aria-label="Light theme">
<div class="pv-head">Light</div>
<div class="pv-grid m">
<span class="pv-state">Default</span><span class="pv-state">Hover</span><span class="pv-state">Focus</span><span class="pv-state">Selected</span><span class="pv-state">Disabled</span><span class="pv-state">Loading</span><span class="pv-state">Error</span>
<button type="button" class="cf-iconbtn" aria-label="Notifications"><svg class="ic" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 16.5V11a6 6 0 0 1 12 0v5.5l1.5 1.5h-15zM10 20.5a2 2 0 0 0 4 0"/></svg></button>
<button type="button" class="cf-iconbtn is-hover" aria-label="Notifications"><svg class="ic" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 16.5V11a6 6 0 0 1 12 0v5.5l1.5 1.5h-15zM10 20.5a2 2 0 0 0 4 0"/></svg></button>
<button type="button" class="cf-iconbtn is-focus" aria-label="Notifications"><svg class="ic" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 16.5V11a6 6 0 0 1 12 0v5.5l1.5 1.5h-15zM10 20.5a2 2 0 0 0 4 0"/></svg></button>
<button type="button" class="cf-iconbtn" aria-pressed="true" aria-label="Grid view"><svg class="ic" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M5.5 4h3.5a1.5 1.5 0 0 1 1.5 1.5v3.5a1.5 1.5 0 0 1 -1.5 1.5h-3.5a1.5 1.5 0 0 1 -1.5 -1.5v-3.5a1.5 1.5 0 0 1 1.5 -1.5zM15 4h3.5a1.5 1.5 0 0 1 1.5 1.5v3.5a1.5 1.5 0 0 1 -1.5 1.5h-3.5a1.5 1.5 0 0 1 -1.5 -1.5v-3.5a1.5 1.5 0 0 1 1.5 -1.5zM5.5 13.5h3.5a1.5 1.5 0 0 1 1.5 1.5v3.5a1.5 1.5 0 0 1 -1.5 1.5h-3.5a1.5 1.5 0 0 1 -1.5 -1.5v-3.5a1.5 1.5 0 0 1 1.5 -1.5zM15 13.5h3.5a1.5 1.5 0 0 1 1.5 1.5v3.5a1.5 1.5 0 0 1 -1.5 1.5h-3.5a1.5 1.5 0 0 1 -1.5 -1.5v-3.5a1.5 1.5 0 0 1 1.5 -1.5z"/></svg></button>
<button type="button" class="cf-iconbtn" disabled aria-label="Previous page"><svg class="ic" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 6l-6 6 6 6"/></svg></button>
<button type="button" class="cf-iconbtn" aria-busy="true" aria-label="Refreshing"><span class="cf-spinner"></span></button>
<button type="button" class="cf-iconbtn is-error" aria-label="Copy failed"><svg class="ic" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4.5l8.5 15h-17zM12 10v4M12 17h.01"/></svg></button>
</div>
<div class="pv-row">
<button type="button" class="cf-iconbtn cf-iconbtn--lg" aria-label="Switch to dark theme"><svg class="ic" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M19.5 14.5A7.5 7.5 0 0 1 9.5 4.5a7.5 7.5 0 1 0 10 10z"/></svg></button>
<button type="button" class="cf-iconbtn" aria-label="Copy password"><svg class="ic" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M10.5 8.5h7.5a2 2 0 0 1 2 2v7.5a2 2 0 0 1 -2 2h-7.5a2 2 0 0 1 -2 -2v-7.5a2 2 0 0 1 2 -2zM15.5 8.5V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v7.5a2 2 0 0 0 2 2h2.5"/></svg></button>
<button type="button" class="cf-iconbtn cf-iconbtn--sm cf-iconbtn--pos" aria-label="Approve"><svg class="ic" width="15" height="15" viewBox="0 0 24 24" style="stroke-width:2" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></button>
<button type="button" class="cf-iconbtn cf-iconbtn--sm cf-iconbtn--neg" aria-label="Reject"><svg class="ic" width="15" height="15" viewBox="0 0 24 24" style="stroke-width:2" aria-hidden="true"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></svg></button>
<button type="button" class="cf-iconbtn cf-iconbtn--graphite" aria-label="Sign out"><svg class="ic" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M9.5 4.5h-3a1 1 0 0 0-1 1v13a1 1 0 0 0 1 1h3M14 16l4-4-4-4M18 12H9"/></svg></button>
<button type="button" class="cf-iconbtn cf-iconbtn--bare cf-iconbtn--sm" aria-label="More actions"><svg class="ic" width="16" height="16" viewBox="0 0 24 24" style="stroke-width:2.5" aria-hidden="true"><path d="M5.5 12h.01M12 12h.01M18.5 12h.01"/></svg></button>
<span class="pv-state">54 · 40 · 32 · approve · reject · graphite · bare</span>
</div>
</section>
</div>
<script>(function(){var w=document.querySelector('.pv-wrap'),a=w.firstElementChild,b=a.cloneNode(true);b.setAttribute('data-theme','dark');b.setAttribute('aria-label','Dark theme');var h=b.querySelector('.pv-head');if(h)h.textContent='Dark';b.querySelectorAll('[id]').forEach(function(e){e.id+='-d'});['for','aria-labelledby','aria-describedby','aria-controls'].forEach(function(k){b.querySelectorAll('['+k+']').forEach(function(e){e.setAttribute(k,e.getAttribute(k).split(' ').map(function(x){return x+'-d'}).join(' '))})});b.querySelectorAll('[name]').forEach(function(e){e.setAttribute('name',e.getAttribute('name')+'-d')});w.appendChild(b)})();</script>
</body>
</html>
