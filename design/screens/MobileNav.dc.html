<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Coffer mobile — Menu</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/design-system/components/bundle.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600&amp;display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&amp;display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&amp;display=swap">
<style>body{margin:0}.msb{height:44px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 22px 0 30px;font-size:15px;font-weight:600}.mn{display:flex;flex-direction:column;border-radius:var(--radius-lg);background:var(--surface);overflow:hidden}.mn a{display:flex;align-items:center;gap:12px;min-height:50px;padding:0 14px;color:var(--ink);text-decoration:none;border-top:1px solid var(--line)}.mn a:first-child{border-top:0}.mn a:hover{background:var(--surface-muted)}.mn-ic{width:32px;height:32px;flex:none;border-radius:10px;background:var(--surface-muted);display:inline-flex;align-items:center;justify-content:center}.co{display:flex;align-items:center;gap:12px;width:100%;min-height:56px;padding:8px 12px;border:0;border-top:1px solid var(--line);background:transparent;color:var(--ink);font:inherit;text-align:left}.co:first-child{border-top:0}.co[aria-pressed="true"]{background:var(--selected)}</style>
</helmet>
<div class="cf cf-phone" data-theme="{{theme}}">
<div class="msb" aria-hidden="true"><span>9:41</span><svg width="68" height="12" viewBox="0 0 68 12"><path d="M1 9h2v2H1zM5 7h2v4H5zM9 5h2v6H9zM13 3h2v8h-2z" fill="currentColor"></path><path d="M24 4.5a8 8 0 0 1 11 0M26.5 7a4.5 4.5 0 0 1 6 0M29.5 10h.01" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round"></path><rect x="44" y="1.5" width="20" height="9" rx="2.5" stroke="currentColor" fill="none"></rect><rect x="46" y="3.5" width="14" height="5" rx="1.2" fill="currentColor"></rect><path d="M65.5 4.5v3" stroke="currentColor" stroke-width="1.4"></path></svg></div>
<header class="cf-mtop">
<span class="cf-row" style="gap: 10px;"><span class="cf-rail-logo" aria-hidden="true" style="width: 36px; height: 36px; font-size: 18px;">C</span><span class="cf-wordmark" style="margin: 0; font-size: 24px;">Coffer</span></span>
<a href="MobileDashboard.dc.html" class="cf-iconbtn" aria-label="Close menu"><svg class="ic" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"></path></svg></a>
</header>
<main class="cf-mscroll">
<section aria-labelledby="co-h" style="display: flex; flex-direction: column; gap: 6px;">
<h2 id="co-h" class="t-label t-muted" style="margin: 0 4px;">Company</h2>
<button type="button" class="cf-card cf-row" style="gap: 12px; width: 100%; border: 0; text-align: left; color: var(--ink); font: inherit;" onClick="{{toggleCo}}" aria-expanded="{{coOpen}}"><span class="cf-switcher-ini" style="width: 40px; height: 40px;">{{cur.ini}}</span><span class="cf-stack" style="flex: 1;"><span class="t-label-strong">{{cur.name}}</span><span class="t-caption t-muted">{{cur.kind}} · {{cur.role}}</span></span><svg class="ic" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true" style="transform: {{coRot}};"><path d="M6 9.5l6 6 6-6"></path></svg></button>
<sc-if value="{{coOpen}}" hint-placeholder-val="{{ false }}"><div class="mn" role="group" aria-label="Switch company"><sc-for list="{{companies}}" as="c" hint-placeholder-count="4"><button type="button" class="co" aria-pressed="{{c.on}}" onClick="{{c.pick}}"><span class="cf-switcher-ini" style="width: 32px; height: 32px; font-size: 11px;">{{c.ini}}</span><span class="cf-stack" style="flex: 1;"><span class="t-label-strong">{{c.name}}</span><span class="t-caption t-muted">{{c.kind}}</span></span></button></sc-for></div></sc-if>
</section>
<label class="cf-search" style="width: 100%;"><svg class="ic" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 11a6.5 6.5 0 1 0 13 0a6.5 6.5 0 1 0 -13 0M20 20l-4.3-4.3"></path></svg><input type="search" aria-label="Search the menu" placeholder="Search or jump to" value="{{q}}" onChange="{{onQ}}" /></label>
<sc-for list="{{groups}}" as="g" hint-placeholder-count="6">
<section style="display: flex; flex-direction: column; gap: 6px;" aria-label="{{g.title}}">
<h2 class="t-label t-muted" style="margin: 4px 4px 0;">{{g.title}}</h2>
<nav class="mn" aria-label="{{g.title}}"><sc-for list="{{g.items}}" as="i" hint-placeholder-count="4"><a href="{{i.href}}" aria-current="{{i.current}}"><span class="mn-ic"><svg class="ic" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="{{i.d}}"></path></svg></span><span class="t-body" style="flex: 1; font-weight: 500;">{{i.label}}</span><sc-if value="{{i.hasBadge}}" hint-placeholder-val="{{ false }}"><span class="cf-pill cf-pill--sm {{i.badgeCls}}">{{i.badge}}</span></sc-if><svg class="ic" width="14" height="14" viewBox="0 0 24 24" aria-hidden="true" style="color: var(--ink-faint);"><path d="M9 6l6 6-6 6"></path></svg></a></sc-for></nav>
</section>
</sc-for>
<sc-if value="{{noMatch}}" hint-placeholder-val="{{ false }}"><div class="cf-empty"><span class="t-label-strong">Nothing called “{{q}}”</span><span class="t-caption t-muted">Try Expenses, Vault or Reports.</span></div></sc-if>
<section class="mn" aria-label="Preferences">
<label class="cf-switch" style="justify-content: space-between; width: 100%; min-height: 54px; padding: 0 14px;"><span class="cf-row" style="gap: 12px;"><span class="mn-ic"><svg class="ic" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M19.5 14.5A7.5 7.5 0 0 1 9.5 4.5a7.5 7.5 0 1 0 10 10z"></path></svg></span><span class="t-body" style="font-weight: 500;">Dark theme</span></span><input class="cf-sr" type="checkbox" role="switch" checked="{{isDark}}" onChange="{{toggleTheme}}" /><span class="cf-switch-track"></span></label>
<a href="SignIn.dc.html" style="color: var(--negative);"><span class="mn-ic" style="background: var(--negative-soft); color: var(--on-negative-soft);"><svg class="ic" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M9.5 4.5h-3a1 1 0 0 0-1 1v13a1 1 0 0 0 1 1h3M14 16l4-4-4-4M18 12H9"></path></svg></span><span class="t-body" style="flex: 1; font-weight: 500;">Sign out</span></a>
</section>
<p class="t-caption t-muted" style="text-align: center; margin: 4px 0 8px;">Signed in as Aarav Mehta · aarav@vertexlabs.in</p>
</main>
<nav class="cf-mtabbar" aria-label="Main"><sc-for list="{{tabs}}" as="t" hint-placeholder-count="5"><a href="{{t.href}}" class="cf-mtab" aria-current="{{t.current}}"><span class="cf-mtab-ic"><svg class="ic" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="{{t.d}}"></path></svg></span>{{t.label}}</a></sc-for></nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["Light","Dark"],"default":"Light","section":"Look"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { themeTick: 0, q: '', coOpen: false, co: 'SP' };
  }

  themeNow() {
    if (this.tweakSeen !== this.props.theme) { this.tweakSeen = this.props.theme; this.override = null; }
    return this.override || (this.props.theme === 'Dark' ? 'dark' : 'light');
  }

  setTheme(next) {
    this.override = next;
    this.setState({ themeTick: this.state.themeTick + 1 });
  }

  icons() {
    return {
      grid: 'M5.5 4h3.5a1.5 1.5 0 0 1 1.5 1.5v3.5a1.5 1.5 0 0 1 -1.5 1.5h-3.5a1.5 1.5 0 0 1 -1.5 -1.5v-3.5a1.5 1.5 0 0 1 1.5 -1.5zM15 4h3.5a1.5 1.5 0 0 1 1.5 1.5v3.5a1.5 1.5 0 0 1 -1.5 1.5h-3.5a1.5 1.5 0 0 1 -1.5 -1.5v-3.5a1.5 1.5 0 0 1 1.5 -1.5zM5.5 13.5h3.5a1.5 1.5 0 0 1 1.5 1.5v3.5a1.5 1.5 0 0 1 -1.5 1.5h-3.5a1.5 1.5 0 0 1 -1.5 -1.5v-3.5a1.5 1.5 0 0 1 1.5 -1.5zM15 13.5h3.5a1.5 1.5 0 0 1 1.5 1.5v3.5a1.5 1.5 0 0 1 -1.5 1.5h-3.5a1.5 1.5 0 0 1 -1.5 -1.5v-3.5a1.5 1.5 0 0 1 1.5 -1.5z',
      bell: 'M6 16.5V11a6 6 0 0 1 12 0v5.5l1.5 1.5h-15zM10 20.5a2 2 0 0 0 4 0',
      pie: 'M4 12a8 8 0 1 0 16 0a8 8 0 1 0 -16 0M12 4v8h8',
      users: 'M5.8 8a3.2 3.2 0 1 0 6.4 0a3.2 3.2 0 1 0 -6.4 0M3.5 19.5c.7-3.2 2.9-5 5.5-5s4.8 1.8 5.5 5M14.6 9a2.4 2.4 0 1 0 4.8 0a2.4 2.4 0 1 0 -4.8 0M16.5 14.6c2 .3 3.4 1.8 4 4.4',
      clock: 'M4 12a8 8 0 1 0 16 0a8 8 0 1 0 -16 0M12 8v4.2l2.8 1.8',
      trend: 'M4 16.5l5-5 3.5 3.5L20 7.5M15 7.5h5v5',
      receipt: 'M6.5 3.5h11v17l-2.75-1.6-2.75 1.6-2.75-1.6-2.75 1.6zM9.5 8h5M9.5 11.5h5M9.5 15h3',
      landmark: 'M3.5 9.5L12 4.5l8.5 5M5 9.5h14M6.5 9.5v7.5M10 9.5v7.5M14 9.5v7.5M17.5 9.5v7.5M4 20h16',
      coins: 'M5 7c0-1.5 3.1-2.5 7-2.5s7 1 7 2.5-3.1 2.5-7 2.5S5 8.5 5 7zM5 7v5c0 1.5 3.1 2.5 7 2.5s7-1 7-2.5V7M5 12v5c0 1.5 3.1 2.5 7 2.5s7-1 7-2.5v-5',
      swap: 'M4 8h15M15.5 4.5L19 8l-3.5 3.5M20 16H5M8.5 12.5L5 16l3.5 3.5',
      bars: 'M4 20h16M7 16.5v-4M11 16.5V7M15 16.5v-6M19 16.5V9.5',
      scale: 'M12 4v16M8.5 20h7M5 7.5h14M5 7.5l-2.5 6a2.5 2.5 0 0 0 5 0zM19 7.5l-2.5 6a2.5 2.5 0 0 0 5 0z',
      file: 'M6.5 3.5h7l4 4v13h-11zM13.5 3.5v4h4M9 12h6M9 15.5h6',
      lock: 'M7 10.5h10a2 2 0 0 1 2 2v6a2 2 0 0 1 -2 2h-10a2 2 0 0 1 -2 -2v-6a2 2 0 0 1 2 -2zM8 10.5V8a4 4 0 0 1 8 0v2.5M12 14.5v2',
      shield: 'M12 3.5l7 3v5c0 4.4-3 8-7 9.5-4-1.5-7-5.1-7-9.5v-5zM9 12l2.2 2.2L15.5 10',
      list: 'M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01',
      sliders: 'M4 7h9M17 7h3M4 17h3M11 17h9M13 7a2 2 0 1 0 4 0a2 2 0 1 0 -4 0M7 17a2 2 0 1 0 4 0a2 2 0 1 0 -4 0',
      card: 'M5 5.5h14a2 2 0 0 1 2 2v9a2 2 0 0 1 -2 2h-14a2 2 0 0 1 -2 -2v-9a2 2 0 0 1 2 -2zM3 9.5h18M7 14.5h4',
      user: 'M8 8a4 4 0 1 0 8 0a4 4 0 1 0 -8 0M4.5 20c1-3.8 4-6 7.5-6s6.5 2.2 7.5 6',
      menu: 'M4 7h16M4 12h16M4 17h16'
    };
  }

  tabs(active, ic) {
    return [['Home', 'grid', 'MobileDashboard.dc.html'], ['Expenses', 'receipt', 'MobileExpenses.dc.html'], ['Hours', 'clock', 'MobileLogHours.dc.html'], ['Vault', 'lock', 'MobileVault.dc.html'], ['Menu', 'menu', 'MobileNav.dc.html']].map((t) => ({ label: t[0], d: ic[t[1]], href: t[2], current: t[0] === active ? 'page' : null }));
  }

  renderVals() {
    const theme = this.themeNow();
    const ic = this.icons();
    const S = this.state;
    const CO = [['SP', 'Saarthi Portal JV', 'Joint venture', 'Admin'], ['VL', 'Vertex Labs Pvt Ltd', 'Single company', 'Admin'], ['NS', 'Northstar Studio', 'Single company', 'Partner'], ['KC', 'Kriya Commerce', 'Single company', 'Viewer']];
    const cur = CO.find((c) => c[0] === S.co) || CO[0];
    const G = [
      ['Overview', [['Dashboard', 'grid', 'MobileDashboard.dc.html'], ['Notifications', 'bell', 'Notifications.dc.html', '3', 'cf-pill--info']]],
      ['People and time', [['Partners', 'pie', 'Partners.dc.html'], ['Team', 'users', 'Team.dc.html'], ['Timesheets', 'clock', 'MobileLogHours.dc.html']]],
      ['Money', [['Income', 'trend', 'Income.dc.html'], ['Expenses', 'receipt', 'MobileExpenses.dc.html', '2 to approve', 'cf-pill--warn'], ['Capital accounts', 'landmark', 'CapitalAccounts.dc.html'], ['Partner loans', 'coins', 'PartnerLoans.dc.html'], ['Settlements', 'swap', 'Settlements.dc.html', '₹3,24,600', 'cf-pill--outline']]],
      ['Reports', [['Profit and loss', 'bars', 'Reports.dc.html'], ['Trial balance', 'scale', 'Statements.dc.html'], ['Balance sheet', 'file', 'Statements.dc.html']]],
      ['Credentials vault', [['Vault items', 'lock', 'MobileVault.dc.html'], ['Security health', 'shield', 'VaultHealth.dc.html', '82', 'cf-pill--pos'], ['Audit log', 'list', 'VaultAudit.dc.html']]],
      ['Account', [['Settings', 'sliders', 'SettingsCompany.dc.html'], ['Billing', 'card', 'Billing.dc.html'], ['Profile and security', 'user', 'Profile.dc.html']]]
    ];
    const q = S.q.trim().toLowerCase();
    const groups = G.map((g) => ({ title: g[0], items: g[1].filter((i) => !q || i[0].toLowerCase().indexOf(q) >= 0 || g[0].toLowerCase().indexOf(q) >= 0).map((i) => ({ label: i[0], d: ic[i[1]], href: i[2], hasBadge: !!i[3], badge: i[3] || '', badgeCls: i[4] || '', current: null })) })).filter((g) => g.items.length);
    return {
      theme: theme, isLight: theme === 'light', isDark: theme === 'dark',
      toggleTheme: () => this.setTheme(theme === 'dark' ? 'light' : 'dark'),
      ic: ic, tabs: this.tabs('Menu', ic),
      cur: { ini: cur[0], name: cur[1], kind: cur[2], role: cur[3] }, coOpen: S.coOpen, coRot: S.coOpen ? 'rotate(180deg)' : 'none',
      toggleCo: () => this.setState({ coOpen: !S.coOpen }),
      companies: CO.map((c) => ({ ini: c[0], name: c[1], kind: c[2] + ' · ' + c[3], on: c[0] === S.co, pick: () => this.setState({ co: c[0], coOpen: false }) })),
      q: S.q, onQ: (e) => this.setState({ q: e.target.value }), groups: groups, noMatch: !groups.length
    };
  }
}
</script>
</body>
</html>
