<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Coffer mobile — Log hours</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/design-system/components/bundle.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600&amp;display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&amp;display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&amp;display=swap">
<style>body{margin:0}.msb{height:44px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 22px 0 30px;font-size:15px;font-weight:600}.wk{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}.wk button{height:58px;border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink);font:inherit;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}.wk button[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}.stp{display:grid;grid-template-columns:52px 1fr 52px;align-items:center;gap:8px}.stp button{height:52px;border-radius:9999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);display:inline-flex;align-items:center;justify-content:center}.stp-v{text-align:center;font-family:var(--font-mono);font-size:34px;line-height:40px;font-weight:500}</style>
</helmet>
<div class="cf cf-phone" data-theme="{{theme}}">
<div class="msb" aria-hidden="true"><span>9:41</span><svg width="68" height="12" viewBox="0 0 68 12"><path d="M1 9h2v2H1zM5 7h2v4H5zM9 5h2v6H9zM13 3h2v8h-2z" fill="currentColor"></path><path d="M24 4.5a8 8 0 0 1 11 0M26.5 7a4.5 4.5 0 0 1 6 0M29.5 10h.01" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round"></path><rect x="44" y="1.5" width="20" height="9" rx="2.5" stroke="currentColor" fill="none"></rect><rect x="46" y="3.5" width="14" height="5" rx="1.2" fill="currentColor"></rect><path d="M65.5 4.5v3" stroke="currentColor" stroke-width="1.4"></path></svg></div>
<header class="cf-mtop">
<h1 class="t-heading" style="margin: 0; font-size: 26px; line-height: 30px;">Timesheets</h1>
<div class="cf-row" style="gap: 6px;"><button type="button" class="cf-iconbtn" onClick="{{toggleTheme}}" aria-label="{{themeLabel}}"><sc-if value="{{isLight}}" hint-placeholder-val="{{ true }}"><svg class="ic" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="{{ic.moon}}"></path></svg></sc-if><sc-if value="{{isDark}}" hint-placeholder-val="{{ false }}"><svg class="ic" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="{{ic.sun}}"></path></svg></sc-if></button><button type="button" class="cf-btn cf-btn--primary cf-btn--sm" onClick="{{openSheet}}">Log hours</button></div>
</header>
<main class="cf-mscroll">
<div class="cf-kv"><span class="t-label-strong">9 – 15 Nov 2026</span><span class="t-money-sm t-muted">{{weekTotal}} this week</span></div>
<div class="wk" role="group" aria-label="Days"><sc-for list="{{week}}" as="d" hint-placeholder-count="7"><button type="button" aria-pressed="{{d.on}}" onClick="{{d.pick}}" aria-label="{{d.aria}}"><span class="t-caption" style="opacity: .7;">{{d.dow}}</span><span class="t-label-strong">{{d.n}}</span></button></sc-for></div>
<sc-for list="{{entries}}" as="e" hint-placeholder-count="4">
<div class="cf-card" style="display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; gap: 12px; align-items: center;"><span class="cf-avatar cf-avatar--graphite">{{e.ini}}</span><span class="cf-stack" style="min-width: 0;"><span class="t-label-strong">{{e.name}}</span><span class="t-caption t-muted">{{e.project}} · {{e.day}}</span></span><span class="cf-stack" style="align-items: flex-end;"><span class="t-money">{{e.hours}}</span><span class="t-caption t-muted">{{e.bill}}</span></span></div>
</sc-for>
<sc-if value="{{noEntries}}" hint-placeholder-val="{{ false }}"><div class="cf-empty"><span class="t-label-strong">No hours on this day</span><span class="t-caption t-muted">Tap Log hours to add some.</span></div></sc-if>
</main>
<nav class="cf-mtabbar" aria-label="Main"><sc-for list="{{tabs}}" as="t" hint-placeholder-count="5"><a href="{{t.href}}" class="cf-mtab" aria-current="{{t.current}}"><span class="cf-mtab-ic"><svg class="ic" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="{{t.d}}"></path></svg></span>{{t.label}}</a></sc-for></nav>

<sc-if value="{{sheet}}" hint-placeholder-val="{{ true }}">
<div class="cf-scrim" aria-hidden="true"></div>
<section class="cf-sheet" role="dialog" aria-modal="true" aria-labelledby="lh-t">
<div class="cf-sheet-grab" aria-hidden="true"></div>
<div class="cf-sheet-head"><h2 id="lh-t" class="t-heading" style="margin: 0;">Log hours</h2><button type="button" class="cf-iconbtn" onClick="{{closeSheet}}" aria-label="Close"><svg class="ic" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"></path></svg></button></div>
<div class="cf-sheet-body">
<div class="cf-seg" role="group" aria-label="Entry type" style="width: 100%;"><sc-for list="{{modes}}" as="m" hint-placeholder-count="2"><button type="button" class="cf-seg-btn" aria-pressed="{{m.on}}" onClick="{{m.pick}}" style="flex: 1;">{{m.label}}</button></sc-for></div>
<div class="cf-field"><label class="cf-label" for="ml-p">Person</label><span class="cf-select"><select id="ml-p" value="{{fWho}}" onChange="{{onWho}}"><option>Rohan Desai</option><option>Arjun Nair</option><option>Dev Patel</option><option>Priya Menon</option><option>Sana Qureshi</option><option>Neha Joshi</option><option>Vivaan Kapoor</option></select><svg class="ic" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="{{ic.chevron}}"></path></svg></span></div>
<sc-if value="{{isDay}}" hint-placeholder-val="{{ true }}">
<div class="cf-kv" style="align-items: center;"><button type="button" class="cf-iconbtn" onClick="{{prevDay}}" aria-label="Previous day"><svg class="ic" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg></button><span class="t-label-strong">{{dayLabel}}</span><button type="button" class="cf-iconbtn" onClick="{{nextDay}}" disabled="{{atToday}}" aria-label="Next day"><svg class="ic" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></button></div>
<div class="stp" role="group" aria-label="Hours"><button type="button" onClick="{{dec}}" aria-label="Half an hour less"><svg class="ic" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"></path></svg></button><span class="stp-v" aria-live="polite">{{hoursText}}<span class="t-caption t-muted" style="font-family: var(--font-sans); margin-left: 4px;">h</span></span><button type="button" onClick="{{inc}}" aria-label="Half an hour more"><svg class="ic" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></button></div>
<div class="cf-field"><label class="cf-label" for="ml-j">Project</label><span class="cf-select"><select id="ml-j"><option>Saarthi portal</option><option>Asha Retail store</option><option>Kiran Exports site</option><option>Internal</option></select><svg class="ic" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="{{ic.chevron}}"></path></svg></span></div>
</sc-if>
<sc-if value="{{isMonth}}" hint-placeholder-val="{{ false }}">
<div class="cf-field"><label class="cf-label" for="ml-m">Month</label><span class="cf-select"><select id="ml-m"><option>November 2026</option><option>October 2026</option></select><svg class="ic" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="{{ic.chevron}}"></path></svg></span></div>
<div class="cf-field"><label class="cf-label" for="ml-t">Total hours</label><span class="cf-inwrap"><input id="ml-t" type="text" inputmode="decimal" value="{{fTotal}}" onChange="{{onTotal}}" style="font-family: var(--font-mono);" /><span class="cf-prefix" style="margin-right: 10px;">h</span></span></div>
<label class="cf-switch" style="justify-content: space-between; width: 100%;"><span class="t-label-strong">Include Saturdays</span><input class="cf-sr" type="checkbox" role="switch" checked="{{sat}}" onChange="{{toggleSat}}" /><span class="cf-switch-track"></span></label>
<div class="cf-inset" style="background: var(--surface-muted);"><span class="t-body">{{monthCalc}}</span></div>
</sc-if>
<label class="cf-switch" style="justify-content: space-between; width: 100%;"><span class="cf-stack"><span class="t-label-strong">Billable</span><span class="t-caption t-muted">Counts toward the client’s hours</span></span><input class="cf-sr" type="checkbox" role="switch" checked="{{billable}}" onChange="{{toggleBill}}" /><span class="cf-switch-track"></span></label>
<div class="cf-field"><label class="cf-label" for="ml-n">Note</label><input id="ml-n" class="cf-input" type="text" value="{{fNote}}" onChange="{{onNote}}" placeholder="What did you work on?" /></div>
</div>
<div class="cf-sheet-foot"><button type="button" class="cf-btn cf-btn--primary cf-btn--lg" style="flex: 1;" onClick="{{save}}" disabled="{{cantSave}}">{{saveLabel}}</button></div>
</section>
</sc-if>
<sc-if value="{{hasToast}}" hint-placeholder-val="{{ false }}"><div class="cf-toast" role="status" style="position: absolute; left: 16px; right: 16px; bottom: 100px; z-index: 60;"><span class="cf-toast-ic"><svg class="ic" width="14" height="14" viewBox="0 0 24 24" style="stroke-width: 2;" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></span>{{toast}}</div></sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["Light","Dark"],"default":"Light","section":"Look"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = {
      themeTick: 0, toast: '', sheet: true, mode: 'Day', day: 15, sel: 13, hours: 7.5, total: '57.33', sat: false, billable: true, who: 'Rohan Desai', note: 'Saarthi payments API',
      entries: [
        { id: 1, ini: 'RD', name: 'Rohan Desai', project: 'Saarthi portal', day: 13, hours: 8, bill: true },
        { id: 2, ini: 'SQ', name: 'Sana Qureshi', project: 'Asha Retail store', day: 13, hours: 6.5, bill: true },
        { id: 3, ini: 'DP', name: 'Dev Patel', project: 'Internal', day: 12, hours: 7, bill: false },
        { id: 4, ini: 'RD', name: 'Rohan Desai', project: 'Saarthi portal', day: 12, hours: 7.5, bill: true }
      ]
    };
  }

  themeNow() {
    if (this.tweakSeen !== this.props.theme) { this.tweakSeen = this.props.theme; this.override = null; }
    return this.override || (this.props.theme === 'Dark' ? 'dark' : 'light');
  }

  setTheme(next) {
    this.override = next;
    this.setState({ themeTick: this.state.themeTick + 1 });
  }

  componentWillUnmount() { if (this.tt) clearTimeout(this.tt); }

  icons() {
    return {
      grid: 'M5.5 4h3.5a1.5 1.5 0 0 1 1.5 1.5v3.5a1.5 1.5 0 0 1 -1.5 1.5h-3.5a1.5 1.5 0 0 1 -1.5 -1.5v-3.5a1.5 1.5 0 0 1 1.5 -1.5zM15 4h3.5a1.5 1.5 0 0 1 1.5 1.5v3.5a1.5 1.5 0 0 1 -1.5 1.5h-3.5a1.5 1.5 0 0 1 -1.5 -1.5v-3.5a1.5 1.5 0 0 1 1.5 -1.5zM5.5 13.5h3.5a1.5 1.5 0 0 1 1.5 1.5v3.5a1.5 1.5 0 0 1 -1.5 1.5h-3.5a1.5 1.5 0 0 1 -1.5 -1.5v-3.5a1.5 1.5 0 0 1 1.5 -1.5zM15 13.5h3.5a1.5 1.5 0 0 1 1.5 1.5v3.5a1.5 1.5 0 0 1 -1.5 1.5h-3.5a1.5 1.5 0 0 1 -1.5 -1.5v-3.5a1.5 1.5 0 0 1 1.5 -1.5z',
      receipt: 'M6.5 3.5h11v17l-2.75-1.6-2.75 1.6-2.75-1.6-2.75 1.6zM9.5 8h5M9.5 11.5h5M9.5 15h3',
      clock: 'M4 12a8 8 0 1 0 16 0a8 8 0 1 0 -16 0M12 8v4.2l2.8 1.8',
      lock: 'M7 10.5h10a2 2 0 0 1 2 2v6a2 2 0 0 1 -2 2h-10a2 2 0 0 1 -2 -2v-6a2 2 0 0 1 2 -2zM8 10.5V8a4 4 0 0 1 8 0v2.5M12 14.5v2',
      menu: 'M4 7h16M4 12h16M4 17h16',
      chevron: 'M6 9.5l6 6 6-6',
      moon: 'M19.5 14.5A7.5 7.5 0 0 1 9.5 4.5a7.5 7.5 0 1 0 10 10z',
      sun: 'M8 12a4 4 0 1 0 8 0a4 4 0 1 0 -8 0M12 2.5v2M12 19.5v2M4.6 4.6L6 6M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4L6 18M18 6l1.4-1.4'
    };
  }

  tabs(active, ic) {
    return [['Home', 'grid', 'MobileDashboard.dc.html'], ['Expenses', 'receipt', 'MobileExpenses.dc.html'], ['Hours', 'clock', 'MobileLogHours.dc.html'], ['Vault', 'lock', 'MobileVault.dc.html'], ['Menu', 'menu', 'MobileNav.dc.html']].map((t) => ({ label: t[0], d: ic[t[1]], href: t[2], current: t[0] === active ? 'page' : null }));
  }

  fmt(h) { const r = Math.round(h * 100) / 100; return r % 1 === 0 ? r.toFixed(1) : String(r); }

  renderVals() {
    const theme = this.themeNow();
    const ic = this.icons();
    const S = this.state;
    const DOW = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
    const dow = (d) => DOW[new Date(2026, 10, d).getDay()];
    let work = 0;
    for (let d = 1; d <= 30; d++) { const w = new Date(2026, 10, d).getDay(); if (w !== 0 && (w !== 6 || S.sat)) work++; }
    const total = Number(String(S.total).replace(/[^0-9.]/g, '')) || 0;
    const ini = { 'Rohan Desai': 'RD', 'Arjun Nair': 'AN', 'Dev Patel': 'DP', 'Priya Menon': 'PM', 'Sana Qureshi': 'SQ', 'Neha Joshi': 'NJ', 'Vivaan Kapoor': 'VK' };
    const shown = S.entries.filter((e) => e.day === S.sel);
    const weekTotal = S.entries.reduce((a, e) => a + e.hours, 0);
    const day = S.mode === 'Day';
    const cantSave = day ? !(S.hours > 0) : !(total > 0);
    return {
      theme: theme, isLight: theme === 'light', isDark: theme === 'dark',
      themeLabel: theme === 'dark' ? 'Switch to light theme' : 'Switch to dark theme',
      toggleTheme: () => this.setTheme(theme === 'dark' ? 'light' : 'dark'),
      ic: ic, tabs: this.tabs('Hours', ic),
      weekTotal: this.fmt(weekTotal) + ' h',
      week: [9, 10, 11, 12, 13, 14, 15].map((d) => ({ n: String(d), dow: dow(d), on: S.sel === d, aria: dow(d) + ' ' + d + ' November', pick: () => this.setState({ sel: d }) })),
      noEntries: !shown.length,
      entries: shown.map((e) => ({ ini: e.ini, name: e.name, project: e.project, day: dow(e.day) + ' ' + e.day + ' Nov', hours: this.fmt(e.hours) + ' h', bill: e.bill ? 'Billable' : 'Internal' })),
      sheet: S.sheet, openSheet: () => this.setState({ sheet: true }), closeSheet: () => this.setState({ sheet: false }),
      modes: ['Day', 'Month'].map((m) => ({ label: m === 'Day' ? 'One day' : 'Whole month', on: S.mode === m, pick: () => this.setState({ mode: m }) })),
      isDay: day, isMonth: !day,
      fWho: S.who, onWho: (e) => this.setState({ who: e.target.value }),
      dayLabel: (S.day === 15 ? 'Today, ' : '') + dow(S.day) + ' ' + S.day + ' Nov', atToday: S.day >= 15,
      prevDay: () => this.setState({ day: Math.max(1, S.day - 1) }), nextDay: () => this.setState({ day: Math.min(15, S.day + 1) }),
      hoursText: this.fmt(S.hours), dec: () => this.setState({ hours: Math.max(0, S.hours - 0.5) }), inc: () => this.setState({ hours: Math.min(24, S.hours + 0.5) }),
      fTotal: S.total, onTotal: (e) => this.setState({ total: e.target.value }),
      sat: S.sat, toggleSat: () => this.setState({ sat: !S.sat }),
      monthCalc: total > 0 ? work + ' working days → ' + (total / work).toFixed(2) + ' hrs/day' : 'Enter the month’s total to spread it over ' + work + ' working days.',
      billable: S.billable, toggleBill: () => this.setState({ billable: !S.billable }),
      fNote: S.note, onNote: (e) => this.setState({ note: e.target.value }),
      cantSave: cantSave, saveLabel: day ? 'Save ' + this.fmt(S.hours) + ' h' : 'Save ' + this.fmt(total) + ' h for November',
      save: () => {
        if (cantSave) return;
        const entry = { id: Date.now(), ini: ini[S.who] || 'RD', name: S.who, project: 'Saarthi portal', day: day ? S.day : 15, hours: day ? S.hours : total, bill: S.billable };
        this.setState({ entries: [entry].concat(S.entries), sheet: false, sel: entry.day <= 15 && entry.day >= 9 ? entry.day : S.sel, toast: day ? this.fmt(S.hours) + ' h logged for ' + S.who.split(' ')[0] : 'November saved · ' + (total / work).toFixed(2) + ' hrs/day' });
        if (this.tt) clearTimeout(this.tt);
        this.tt = setTimeout(() => this.setState({ toast: '' }), 2600);
      },
      toast: S.toast, hasToast: !!S.toast
    };
  }
}
</script>
</body>
</html>
