<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Coffer mobile — Dashboard</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/design-system/components/bundle.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600&amp;display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&amp;display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&amp;display=swap">
<style>body{margin:0}.msb{height:44px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 22px 0 30px;font-size:15px;font-weight:600}.mini{flex:1;border-radius:4px 4px 0 0;background:rgba(28,28,30,.85)}.mini.neg{border-radius:0 0 4px 4px;background:rgba(28,28,30,.35)}.mini.on{background:#fff}.todo{display:flex;align-items:center;gap:12px;min-height:60px;padding:10px 12px;border-radius:var(--radius-md);background:var(--surface);color:var(--ink);text-decoration:none}</style>
</helmet>
<div class="cf cf-phone" data-theme="{{theme}}">
<div class="msb" aria-hidden="true"><span>9:41</span><svg width="68" height="12" viewBox="0 0 68 12"><path d="M1 9h2v2H1zM5 7h2v4H5zM9 5h2v6H9zM13 3h2v8h-2z" fill="currentColor"></path><path d="M24 4.5a8 8 0 0 1 11 0M26.5 7a4.5 4.5 0 0 1 6 0M29.5 10h.01" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round"></path><rect x="44" y="1.5" width="20" height="9" rx="2.5" stroke="currentColor" fill="none"></rect><rect x="46" y="3.5" width="14" height="5" rx="1.2" fill="currentColor"></rect><path d="M65.5 4.5v3" stroke="currentColor" stroke-width="1.4"></path></svg></div>
<header class="cf-mtop">
<a href="MobileNav.dc.html" class="cf-switcher" style="height: 44px; padding-right: 12px;" aria-label="Switch company, Saarthi Portal JV"><span class="cf-switcher-ini" style="width: 32px; height: 32px;">SP</span><span class="t-label-strong">Saarthi Portal JV</span><svg class="ic" width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><path d="{{ic.chevron}}"></path></svg></a>
<div class="cf-row" style="gap: 6px;">
<button type="button" class="cf-iconbtn" onClick="{{toggleTheme}}" aria-label="{{themeLabel}}"><sc-if value="{{isLight}}" hint-placeholder-val="{{ true }}"><svg class="ic" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="{{ic.moon}}"></path></svg></sc-if><sc-if value="{{isDark}}" hint-placeholder-val="{{ false }}"><svg class="ic" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="{{ic.sun}}"></path></svg></sc-if></button>
<a href="Notifications.dc.html" class="cf-iconbtn" aria-label="Notifications, 3 unread" style="position: relative;"><svg class="ic" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="{{ic.bell}}"></path></svg><span class="cf-badge" aria-hidden="true" style="top: 2px; right: 2px; border-color: var(--canvas);">3</span></a>
</div>
</header>
<main class="cf-mscroll">
<div class="cf-stack" style="gap: 2px; padding-top: 4px;"><span class="t-caption t-muted">Sunday, 15 Nov</span><h1 class="t-heading" style="margin: 0; font-size: 26px; line-height: 30px;">Good afternoon, Aarav</h1></div>
<section class="cf-card cf-card--lime" style="position: relative; overflow: hidden; display: flex; flex-direction: column; gap: 10px; padding: 18px;" aria-label="Net profit">
<div aria-hidden="true" style="position: absolute; right: -50px; top: -70px; width: 200px; height: 200px; border-radius: 9999px; background: rgba(255,255,255,0.8); filter: blur(44px);"></div>
<div class="cf-kv" style="position: relative;"><span class="t-label-strong">Net profit · FY to date</span><span class="t-caption">Apr – Oct</span></div>
<div style="position: relative; display: flex; align-items: baseline; gap: 4px;"><span class="t-money-unit">₹</span><span class="t-figure-hero" style="font-size: 40px; line-height: 44px;">18,42,350</span></div>
<div style="position: relative;"><div style="height: 54px; display: flex; align-items: flex-end; gap: 6px;"><sc-for list="{{bars}}" as="b" hint-placeholder-count="7"><span class="mini {{b.cls}}" style="height: {{b.up}};"></span></sc-for></div><div style="height: 10px; display: flex; align-items: flex-start; gap: 6px; border-top: 1px solid rgba(28,28,30,.35);"><sc-for list="{{bars}}" as="b" hint-placeholder-count="7"><span class="mini neg" style="height: {{b.down}};"></span></sc-for></div></div>
<span class="t-caption" style="position: relative;">29.7% margin · best month Sep, ₹6,55,000</span>
</section>
<section style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px;" aria-label="Key figures">
<sc-for list="{{kpis}}" as="k" hint-placeholder-count="4"><a href="{{k.href}}" class="cf-card" style="display: flex; flex-direction: column; gap: 4px; text-decoration: none; background: {{k.bg}}; color: {{k.fg}};"><span class="t-caption" style="opacity: .75;">{{k.label}}</span><span class="t-money" style="font-size: 17px; line-height: 22px;">{{k.value}}</span><span class="t-caption" style="opacity: .75;">{{k.sub}}</span></a></sc-for>
</section>
<section aria-labelledby="nd-h" style="display: flex; flex-direction: column; gap: 8px;">
<h2 id="nd-h" class="cf-dot-title t-title" style="margin: 4px 0 2px;">Needs you</h2>
<sc-for list="{{todos}}" as="t" hint-placeholder-count="3"><a href="{{t.href}}" class="todo"><span class="cf-notif-ic {{t.icCls}}"><svg class="ic" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="{{t.d}}"></path></svg></span><span class="cf-stack" style="flex: 1; min-width: 0;"><span class="t-label-strong">{{t.title}}</span><span class="t-caption t-muted">{{t.sub}}</span></span><svg class="ic" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></a></sc-for>
</section>
<section class="cf-card" aria-labelledby="pd-h" style="display: flex; flex-direction: column; gap: 10px;">
<div class="cf-kv"><h2 id="pd-h" class="cf-dot-title t-title">Profit due</h2><span class="t-caption t-muted">by equity</span></div>
<sc-for list="{{partners}}" as="p" hint-placeholder-count="4"><div class="cf-kv" style="align-items: center;"><span class="cf-row" style="gap: 10px;"><span class="cf-avatar cf-avatar--sm">{{p.ini}}<span class="cf-avatar-dot" style="background: {{p.dot}};"></span></span><span class="cf-stack"><span class="t-body">{{p.name}}</span><span class="t-caption t-muted">{{p.eq}} equity</span></span></span><span class="t-money-sm">{{p.due}}</span></div></sc-for>
</section>
</main>
<nav class="cf-mtabbar" aria-label="Main"><sc-for list="{{tabs}}" as="t" hint-placeholder-count="5"><a href="{{t.href}}" class="cf-mtab" aria-current="{{t.current}}"><span class="cf-mtab-ic"><svg class="ic" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="{{t.d}}"></path></svg></span>{{t.label}}</a></sc-for></nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["Light","Dark"],"default":"Light","section":"Look"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { themeTick: 0 };
  }

  themeNow() {
    if (this.tweakSeen !== this.props.theme) { this.tweakSeen = this.props.theme; this.override = null; }
    return this.override || (this.props.theme === 'Dark' ? 'dark' : 'light');
  }

  setTheme(next) {
    this.override = next;
    this.setState({ themeTick: this.state.themeTick + 1 });
  }

  icons() {
    return {
      grid: 'M5.5 4h3.5a1.5 1.5 0 0 1 1.5 1.5v3.5a1.5 1.5 0 0 1 -1.5 1.5h-3.5a1.5 1.5 0 0 1 -1.5 -1.5v-3.5a1.5 1.5 0 0 1 1.5 -1.5zM15 4h3.5a1.5 1.5 0 0 1 1.5 1.5v3.5a1.5 1.5 0 0 1 -1.5 1.5h-3.5a1.5 1.5 0 0 1 -1.5 -1.5v-3.5a1.5 1.5 0 0 1 1.5 -1.5zM5.5 13.5h3.5a1.5 1.5 0 0 1 1.5 1.5v3.5a1.5 1.5 0 0 1 -1.5 1.5h-3.5a1.5 1.5 0 0 1 -1.5 -1.5v-3.5a1.5 1.5 0 0 1 1.5 -1.5zM15 13.5h3.5a1.5 1.5 0 0 1 1.5 1.5v3.5a1.5 1.5 0 0 1 -1.5 1.5h-3.5a1.5 1.5 0 0 1 -1.5 -1.5v-3.5a1.5 1.5 0 0 1 1.5 -1.5z',
      receipt: 'M6.5 3.5h11v17l-2.75-1.6-2.75 1.6-2.75-1.6-2.75 1.6zM9.5 8h5M9.5 11.5h5M9.5 15h3',
      clock: 'M4 12a8 8 0 1 0 16 0a8 8 0 1 0 -16 0M12 8v4.2l2.8 1.8',
      lock: 'M7 10.5h10a2 2 0 0 1 2 2v6a2 2 0 0 1 -2 2h-10a2 2 0 0 1 -2 -2v-6a2 2 0 0 1 2 -2zM8 10.5V8a4 4 0 0 1 8 0v2.5M12 14.5v2',
      menu: 'M4 7h16M4 12h16M4 17h16',
      swap: 'M4 8h15M15.5 4.5L19 8l-3.5 3.5M20 16H5M8.5 12.5L5 16l3.5 3.5',
      chevron: 'M6 9.5l6 6 6-6',
      bell: 'M6 16.5V11a6 6 0 0 1 12 0v5.5l1.5 1.5h-15zM10 20.5a2 2 0 0 0 4 0',
      moon: 'M19.5 14.5A7.5 7.5 0 0 1 9.5 4.5a7.5 7.5 0 1 0 10 10z',
      sun: 'M8 12a4 4 0 1 0 8 0a4 4 0 1 0 -8 0M12 2.5v2M12 19.5v2M4.6 4.6L6 6M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4L6 18M18 6l1.4-1.4'
    };
  }

  tabs(active, ic) {
    return [['Home', 'grid', 'MobileDashboard.dc.html'], ['Expenses', 'receipt', 'MobileExpenses.dc.html'], ['Hours', 'clock', 'MobileLogHours.dc.html'], ['Vault', 'lock', 'MobileVault.dc.html'], ['Menu', 'menu', 'MobileNav.dc.html']].map((t) => ({ label: t[0], d: ic[t[1]], href: t[2], current: t[0] === active ? 'page' : null }));
  }

  renderVals() {
    const theme = this.themeNow();
    const ic = this.icons();
    const profit = [-65000, 150000, 170000, 365000, -32650, 655000, 600000];
    return {
      theme: theme, isLight: theme === 'light', isDark: theme === 'dark',
      themeLabel: theme === 'dark' ? 'Switch to light theme' : 'Switch to dark theme',
      toggleTheme: () => this.setTheme(theme === 'dark' ? 'light' : 'dark'),
      ic: ic, tabs: this.tabs('Home', ic),
      bars: profit.map((p, i) => ({ up: (p > 0 ? Math.round((p / 655000) * 100) : 0) + '%', down: (p < 0 ? Math.round((-p / 65000) * 10) : 0) + 'px', cls: i === 6 ? 'on' : '' })),
      kpis: [
        { label: 'Revenue', value: '₹62,10,000', sub: '38 entries', href: 'Income.dc.html', bg: 'var(--surface)', fg: 'var(--ink)' },
        { label: 'Expenses', value: '₹43,67,650', sub: 'incl. salaries', href: 'MobileExpenses.dc.html', bg: 'var(--surface)', fg: 'var(--ink)' },
        { label: 'Hours logged', value: '2,157.5 h', sub: '8 people', href: 'MobileLogHours.dc.html', bg: 'var(--surface)', fg: 'var(--ink)' },
        { label: 'To settle', value: '₹3,24,600', sub: 'Vertex → Bluefin', href: 'Settlements.dc.html', bg: 'var(--graphite)', fg: 'var(--on-graphite)' }
      ],
      todos: [
        { title: '2 expenses to approve', sub: 'Rohan ₹640 · Kabir ₹4,860', d: ic.receipt, icCls: 'cf-notif-ic--lime', href: 'MobileExpenses.dc.html' },
        { title: 'Vercel token expires in 9 days', sub: 'Internal vault · renew by 24 Nov', d: ic.lock, icCls: 'cf-notif-ic--warn', href: 'MobileVault.dc.html' },
        { title: 'Settle ₹3,24,600 with Bluefin', sub: 'Vertex Labs holds more than its share', d: ic.swap, icCls: '', href: 'Settlements.dc.html' }
      ],
      partners: [['AM', 'Aarav Mehta', 'var(--partner-1)', '30%', '₹5,52,705'], ['IR', 'Ishita Rao', 'var(--partner-2)', '20%', '₹3,68,470'], ['KS', 'Kabir Shah', 'var(--partner-3)', '25%', '₹4,60,588'], ['MI', 'Meera Iyer', 'var(--partner-4)', '25%', '₹4,60,587']].map((p) => ({ ini: p[0], name: p[1], dot: p[2], eq: p[3], due: p[4] }))
    };
  }
}
</script>
</body>
</html>
